- policy_id: TU.ADVISING.NEW_STUDENT_PROGRAMME
  topic: advising
  title_ar: خدمات الإرشاد للطلاب المستجدين
  authority_level: OFFICIAL_STUDENT_GUIDE
  source: { document_id: TU_STUDENT_GUIDE_V3_1447, page: 16 }
  source_text_ar: >
    تتولى عمادة القبول والتسجيل بالاشتراك مع الكلية تنظيم برنامج خاص للطلاب
    المستجدين لشرح نظام الدراسة والتقويم والخطط الدراسية لبرامج التخصصات، ما يمثل
    إرشاداً جماعياً ويتضمن هذا البرنامج لقاء الطلاب مع عميد الكلية للترحيب وتعريف
    الطلاب بواجباتهم وحقوقهم والسلوكيات المطلوبة منهم والسلوكيات المرفوضة منهم
    وأوجه الثواب والعقاب. يلتقي الطلاب بمرشديهم الأكاديميين لاستيفاء بيانات ملفات
    الإرشاد الأكاديمي.
  rule_type: procedure
  audience: NEW_STUDENTS
  source_edition: "1447"
  policy_effective_from: null
  policy_effective_to: null
  currentness_status: UNVERIFIED
  verification: *v_extracted
  extraction_confidence: high

- policy_id: TU.ADVISING.CONTINUING_STUDENT_PROGRAMME
  topic: advising
  title_ar: خدمات الإرشاد للطلاب المتخصصين
  authority_level: OFFICIAL_STUDENT_GUIDE
  source: { document_id: TU_STUDENT_GUIDE_V3_1447, page: 16 }
  source_text_ar: >
    تتم لقاءات الطلاب القدامى مع مرشديهم الأكاديميين عند بدء تسجيل رغبات الفصل
    التالي، وذلك طبقاً لمواعيد محددة مسبقاً في التقويم الدراسي، حيث يمكن الحصول
    على التقويم من موقع عمادة القبول والتسجيل بالجامعة. يقوم كل مرشد بدراسة حالة
    كل طالب من خلال النماذج والتقارير التي يضمها الملف الإرشادي الإلكتروني الخاص
    به وتوجيهه بما يتفق مع ميوله وقدراته واستعداداته.
  rule_type: procedure
  audience: CONTINUING_STUDENTS
  timing: AT_PREFERENCE_REGISTRATION_FOR_NEXT_TERM
  timing_defined_in: TU_ACADEMIC_CALENDAR
  source_edition: "1447"
  policy_effective_from: null
  policy_effective_to: null
  currentness_status: UNVERIFIED
  verification: *v_extracted
  extraction_confidence: high
  cross_references: [TU.REG.EARLY_REGISTRATION_TIMING]
