- policy_id: TU.CONTACT.ADVISER_CHANNELS
  topic: contact_channels
  title_ar: وسائل التواصل مع المرشد الأكاديمي
  authority_level: OFFICIAL_STUDENT_GUIDE
  source: { document_id: TU_STUDENT_GUIDE_V3_1447, page: 15 }
  source_text_ar: >
    الإرشاد الأكاديمي ليس عمل عابر بل هو سلسلة من اللقاءات التي تحدث بين فترة
    وأخرى بين المرشد وطلابه تحت الإرشاد، وهي عملية مستمرة ومنتظمة ترافق مسيرة
    الطالب/ـة حتى التخرج.
  rule_type: enumeration
  channels:
    - "الإرشاد عن طريق منصة خدمة تك"
    - "الإرشاد عن طريق البلاك بورد"
    - "الإرشاد عن طريق البريد الإلكتروني"
    - "الإرشاد عبر الهاتف / التيمز"
    - "الإرشاد المباشر"
  source_edition: "1447"
  policy_effective_from: null
  policy_effective_to: null
  currentness_status: UNVERIFIED
  verification: &v_extracted
    status: EXTRACTED
    extracted_by: agent
    extracted_at: "2026-08-01"
    source_verified_by: null
    domain_reviewed_by: null
    authority_approved_by: null
  extraction_confidence: high
  notes: >
    Answers the "مين أتواصل معه؟" class of questions (Q59, Q128, Q133) at the
    adviser level. Escalation beyond the adviser is covered by
    TU.APPEAL.ESCALATION_PATH and TU.REG.STUDENT_CHOICES_FINAL.

