- policy_id: TU.REG.STUDENT_CHOICES_FINAL
  topic: registration_process
  title_ar: نهائية اختيارات الطالب وصلاحيات التعديل
  authority_level: OFFICIAL_STUDENT_GUIDE
  source: { document_id: TU_STUDENT_GUIDE_V3_1447, pages: [17, 21] }
  source_text_ar: >
    يعتبر جدول الطالب نهائياً. تعتبر اختيارات الطالب نهائية ولا يتم التعديل إلا
    بمعرفة المرشد. حصر التسجيل بالتجاوز لوكيل الكلية أو المشرف الأكاديمي. تغيير
    التخصص من صلاحيات الكلية فقط.
  rule_type: authority_allocation
  authorities:
    - { action: MODIFY_REGISTRATION, actor: ACADEMIC_ADVISER, note: "لا يتم التعديل إلا بمعرفة المرشد" }
    - { action: OVERRIDE_REGISTRATION, actor: [COLLEGE_VICE_DEAN, ACADEMIC_SUPERVISOR], exclusive: true }
    - { action: CHANGE_MAJOR, actor: COLLEGE, exclusive: true }
  source_edition: "1447"
  policy_effective_from: null
  policy_effective_to: null
  currentness_status: UNVERIFIED
