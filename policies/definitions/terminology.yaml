# مصطلحات الإرشاد الأكاديمي — pp.7-9.
#
# Highest return-on-effort content in the store: every one of these answers a
# student question with ZERO student data required, so none of it is blocked by the
# grade/attendance/calendar gaps. Pure EXPLAIN_ONLY by nature, not by deficiency.

- policy_id: TU.DEF.CALENDAR_UNITS
  topic: terminology
  title_ar: مصطلحات النظام والفصول الدراسية
  authority_level: OFFICIAL_STUDENT_GUIDE
  source: { document_id: TU_STUDENT_GUIDE_V3_1447, page: 7 }
  rule_type: definitions
  terms:
    - term_ar: العام الدراسي
      definition_ar: >
        فصلان دراسيان أو أكثر وفصل صيفي إن وجد، أو أربع مستويات إن وجد ومستوى صيفي
        أو مستويين صيفيين إن وجد.
    - term_ar: النظام الدراسي
      definition_ar: >
        أسلوب الدراسة المتبع في كليات ومعاهد الجامعة، سواء بنظام المستويات
        الدراسية، أو الفصول الدراسية، أو السنة الدراسية الكاملة.
    - term_ar: الفصل الدراسي
      definition_ar: >
        مدة زمنية لا تقل عن خمسة عشر أسبوعاً في نظام الفصلين الدراسيين، ولا تقل عن
        اثني عشر أسبوعاً في نظام الفصول الدراسية الثلاثة، ولا تدخل ضمنها فترات
        التسجيل والحذف والإضافة والاختبارات النهائية.
    - term_ar: المستوى الدراسي
      definition_ar: >
        أسلوب دراسي تكون المدة الزمنية فيه أقل من الفصل الدراسي، بحيث لا يقل عن
        أربعة أسابيع ولا يزيد على ثمانية أسابيع، ولا يقل إجمالي الأسابيع الدراسية
        عن أربعين أسبوعاً في العام.
    - term_ar: السنة الدراسية
      definition_ar: مدة زمنية لا تقل عن أربعين أسبوعاً في العام.
    - term_ar: الفصل الصيفي
      definition_ar: >
        مدة زمنية لا تقل عن ثمانية أسابيع لنظام الفصلين الدراسيين، ولا تقل عن ستة
        أسابيع لنظام الفصول الدراسية الثلاثة، وتُضاعف خلالها المدة المخصصة لكل
        مقرر دراسي.
    - term_ar: المستوى الصيفي
      definition_ar: >
        مدة زمنية لا تقل عن أربعة أسابيع لنظام المستوى الدراسي، وتُضاعف خلالها
        المدة المخصصة لكل مقرر دراسي.
    - term_ar: الخطة الدراسية
      definition_ar: >
        مجموعة المقررات الدراسية الإجبارية والاختيارية والحُرة، التي تشكل مجموع
        وحداتها متطلبات التخرج، التي يجب على الطالب/ـة اجتيازها بنجاح للحصول على
        الدرجة العلمية في التخصص المحدد.
    - term_ar: المقرر الدراسي
      definition_ar: >
        المادة الدراسية في خطة كل برنامج، وتشتمل رقماً ورمزاً ووصفاً للمحتوى،
        وتخضع في كل قسم للمتابعة والتقييم والتطوير، ويجوز أن تُدرس مستقلة، أو أن
        يكون لها متطلب سابق، أو متطلب متزامن معها.
    - term_ar: الوحدة الدراسية
      definition_ar: >
        المحاضرة النظرية الأسبوعية (أو الدرس السريري أو درس التمارين) التي لا تقل
        مدتها عن خمسين دقيقة، أو الدرس العملي الذي لا تقل مدته عن مئة دقيقة، أو
        الدرس الميداني المحدد في الخطة الدراسية.
    - term_ar: أنماط التعليم
      definition_ar: >
        طرائق التعليم المختلفة ومنها التعليم الحضوري، التعليم المدمج، التعليم عن
        بعد، التعليم الذاتي، وغيرها.
    - term_ar: برنامج الترقية الأكاديمية (التجسير)
      definition_ar: البرنامج المصمم لإكمال الدراسة من الدبلوم إلى البكالوريوس.
