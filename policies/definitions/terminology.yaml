  extraction_confidence: high
  key_finding: >
    المقرر الدراسي explicitly admits "متطلب متزامن" — CONCURRENT prerequisites are
    recognised by the regulation. Earlier project analysis recorded co-requisites as
    a concept the university does not use; that was wrong. They exist in the rules
    and are absent from OUR schema (the prerequisites table holds a single relation
    type). Q13/Q14 are therefore a DATA gap, not a non-existent concept. The guide
    defines متطلب سابق on p.9 but gives no standalone definition or rules for
    متطلب متزامن — those must come from TU_UNDERGRAD_REGULATION.

- policy_id: TU.DEF.ASSESSMENT_AND_RECORD
  topic: terminology
  title_ar: مصطلحات الدرجات والسجل الأكاديمي
  authority_level: OFFICIAL_STUDENT_GUIDE
  source: { document_id: TU_STUDENT_GUIDE_V3_1447, page: 8 }
  rule_type: definitions
  terms:
    - term_ar: درجة الأعمال الفصلية
      definition_ar: >
        الدرجة الممنوحة للأعمال التي يتحصل عليها الطالب/ـة خلال الدراسة في مستوى
        دراسي أو فصل دراسي أو السنة الدراسية -إن وجدت- وتشمل الاختبارات والبحوث
        والأنشطة التعليمية التي تتصل بالمقرر الدراسي.
    - term_ar: الاختبار النهائي
      definition_ar: >
        اختبار في المقرر الدراسي يعقد مرة واحدة في نهاية تدريس المقرر الدراسي.
    - term_ar: درجة الاختبار النهائي
      definition_ar: >
        الدرجة التي يحصل عليها الطالب/ـة في الاختبار النهائي في كل مقرر دراسي.
    - term_ar: الدرجة النهائية
      definition_ar: >
        مجموع درجات الأعمال الفصلية وتُضاف إليها درجة الاختبار النهائي لكل مقرر
        دراسي، وتحسب الدرجة الإجمالية من مئة.
    - term_ar: السجل الأكاديمي
      definition_ar: >
        بيان تفصيلي يتضمن جميع المقررات الدراسية التي درسها الطالب/ـة والتقديرات
        التي حصل عليها، ويشمل المعدلين (الفصلي والتراكمي).
    - term_ar: الطالب الزائر
      definition_ar: >
        الطالب/ـة الذي يقوم بدراسة بعض المقررات الدراسية في جامعة أخرى، أو في فرع
        من فروع الجامعة التي ينتمي إليها دون تحويله.
    - term_ar: التقدير
      definition_ar: >
        وصف للنسبة المئوية أو الرمز الأبجدي للدرجة النهائية التي حصل عليها
        الطالب/ـة في أي مقرر دراسي.
    - term_ar: تقدير غير مكتمل
      definition_ar: >
        تقدير يُرصد لكل مقرر دراسي يتعذر على الطالب/ـة استكمال متطلباته في الموعد
        المحدد، ويرمز له في السجل الأكاديمي بالرمز (ل) (IC).
    - term_ar: تقدير مستمر
      definition_ar: >
        تقدير يُرصد لكل مقرر دراسي يتطلب أكثر من فصل دراسي لاستكمال دراسته، ويرمز
        له بالرمز (م) أو (IP).
    - term_ar: المعدل الفصلي
      definition_ar: >
        حاصل قسمة مجموع النقاط التي حصل عليها الطالب/ـة على مجموع الوحدات المقررة
        لجميع المقررات الدراسية التي درسها في أي فصل دراسي، وتحسب النقاط بضرب
        الوحدة المقررة في وزن التقدير الذي حصل عليه في كل مقرر دراسي.
    - term_ar: المعدل التراكمي
      definition_ar: >
        حاصل قسمة مجموع النقاط التي حصل عليها الطالب/ـة في جميع المقررات الدراسية
        التي درسها منذ التحاقه بالجامعة على مجموع الوحدات المقررة لتلك المقررات.
  source_edition: "1447"
