- policy_id: TU.DEF.PROGRAMME_AND_COURSES
  topic: terminology
  title_ar: مصطلحات البرنامج وأنواع المقررات
  authority_level: OFFICIAL_STUDENT_GUIDE
  source: { document_id: TU_STUDENT_GUIDE_V3_1447, page: 9 }
  rule_type: definitions
  terms:
    - term_ar: التقدير العام
      definition_ar: وصف مستوى التحصيل العلمي للطالب/ـة خلال مدة دراسته في الجامعة.
    - term_ar: العبء الدراسي
      definition_ar: >
        مجموع الوحدات الدراسية التي يسمح للطالب/ـة التسجيل فيها في مستوى دراسي أو
        فصل دراسي أو سنة دراسية كاملة، محددة من مجلس الجامعة.
    - term_ar: البرنامج الدراسي
      definition_ar: >
        برنامج متكامل من المقررات التي تعد الطالب/ـة خلال مدة زمنية محددة إعداداً
        معرفياً ومهارياً وشخصياً؛ لنيل الدرجة العلمية في تخصص محدد.
    - term_ar: متطلبات الجامعة
      definition_ar: >
        مقررات إجبارية ومقررات اختيارية يدرسها جميع طلبة الجامعة في مرحلة
        البكالوريوس.
    - term_ar: متطلبات الكلية
      definition_ar: مقررات إجبارية معيّنة يدرسها جميع طلبة الكلية.
    - term_ar: متطلبات البرنامج
      definition_ar: >
        مقررات إجبارية معينة لعدد محدد من الوحدات الدراسية المعتمدة يدرسها جميع
        طلبة البرنامج.
    - term_ar: المقررات الاختيارية
      definition_ar: >
        مجموعة من المقررات يختار منها الطالب/ـة عدداً مطلوباً من الوحدات الدراسية
        المعتمدة والمخصصة للمقررات الاختيارية للبرنامج الدراسي.
    - term_ar: المقررات المساعدة
      definition_ar: >
        مقررات إجبارية يدرسها طلبة برنامج من قسم أو برنامج آخر وتعتبر ضمن المقررات
        الإجبارية للبرنامج.
    - term_ar: المقررات الحرة
      definition_ar: >
        مقررات اختيارية حرة متاحة على مستوى الجامعة ضمن برامجها الدراسية المطروحة،
        وليس لها متطلب.
    - term_ar: متطلب سابق
      definition_ar: >
        مقرر دراسي يجب على الطالب/ـة اجتيازه قبل تسجيل مقرر آخر ضمن الخطة الدراسية
        للبرنامج بحيث يكون بينهما ارتباط في المجال.
    - term_ar: الانقطاع
      definition_ar: >
        حالة أكاديمية تسجل على النظام عند عدم تسجيل الطالب/ـة أي مقرر في فصل دراسي
        أو سنة دراسية دون حصوله على إذن بتأجيل الدراسة أو الاعتذار، ولا تحسب فترة
        الانقطاع ضمن مدة الدراسة للتخرج في حالة أعيد قيده بعذر تقبله اللجنة المختصة.
    - term_ar: طي القيد
      definition_ar: >
        تعليق أو إيقاف علاقة الطالب/ـة بالجامعة سواء أكان ذلك عن طريق الفصل
        الأكاديمي أو التأديبي أو الانسحاب النهائي أو الانقطاع عن الدراسة أو التغيب
        المتواصل أو انتهاء الفترة المحددة للبرنامج حسب الخطة الدراسية بدون
        اجتيازها، وذلك لمدة محددة.
  source_edition: "1447"
  policy_effective_from: null
  policy_effective_to: null
  currentness_status: UNVERIFIED
  verification: *v_approved
  extraction_confidence: high
  mapping_to_project_data: >
    ProgrammeRequirement.type carries exactly four values — Mandatory (511),
    Program Elective (38), University Elective (30), Free Elective (16) — which map
    onto متطلبات البرنامج / المقررات الاختيارية / متطلبات الجامعة / المقررات الحرة.
    This record supplies the official definitions behind labels the database already
    uses, and answers Q8, Q114, Q115, Q116 with a citation rather than a paraphrase.
  key_finding: >
    المقررات الحرة are defined as having NO prerequisite ("وليس لها متطلب"). That is
    a checkable invariant against the prerequisites table for the 16 Free Elective
    rows — a cheap data-quality test the store makes possible.
