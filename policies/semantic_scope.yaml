schema_version: '1.0'
_comment: 'Curated applicability scope, NOT extracted source. The records say what the guide says; this
  says which questions each record may be used to answer. excluded_intents is the field that does the
  work: it names the questions a retriever would plausibly route here on shared vocabulary and which
  this record must never be used to answer.'
scope:
- policy_id: TU.ADVISING.CONTINUING_STUDENT_PROGRAMME
  concept_id: advising_relationship
  governing_entity: ADVISING
  action: ADVISE
  claim_types:
  - PROCEDURE
  direct_answer_intents:
  - continuing_student_advising_timing
  - when_do_i_meet_my_adviser
  excluded_intents:
  - new_student_orientation_programme
  - preference_registration_window
  - add_drop_deadline
  - academic_calendar_dates
  why_excluded: fixes advising meetings relative to preference registration and then points at the academic
    calendar; it carries no date of its own, so it must never supply a registration or add/drop deadline
- policy_id: TU.ADVISING.NEW_STUDENT_PROGRAMME
  concept_id: advising_relationship
  governing_entity: ADVISING
  action: ADVISE
  claim_types:
  - PROCEDURE
  - ENTITLEMENT
  direct_answer_intents:
  - new_student_orientation_programme
  - first_advising_meeting_for_new_students
  - group_advising_for_new_students
  excluded_intents:
  - continuing_student_advising_timing
  - preference_registration_window
  - adviser_duties_at_registration
  - student_conduct_penalties
  why_excluded: describes the one-off orientation for new entrants; it mentions rights, duties and 'الثواب
    والعقاب' in passing as agenda items but states no conduct rule, and it does not govern when continuing
    students meet their adviser
- policy_id: TU.ADVISING.STUDENT_DUTIES
  concept_id: advising_relationship
  governing_entity: ADVISING
  action: ADVISE
  claim_types:
  - PROCEDURE
  direct_answer_intents:
  - student_duties_toward_adviser
  - what_to_do_if_no_adviser_is_assigned
  excluded_intents:
