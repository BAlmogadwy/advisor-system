  - academic_calendar_dates
  - course_withdrawal_deadline
  - semester_excuse_procedure
  - attendance_requirement
  - student_conduct_penalties
  why_excluded: lists the student's obligations. It tells the student to go read the calendar and the
    لائحة and to ask about الانسحاب/الاعتذار — it reproduces none of their content, so it can never
    be evidence for a date, a withdrawal rule or an excuse rule; and a duty is not a disciplinary rule
- policy_id: TU.ADVISING.STUDENT_RIGHTS
  concept_id: advising_relationship
  governing_entity: ADVISING
  action: ADVISE
  claim_types:
  - ENTITLEMENT
  - PROCEDURE
  direct_answer_intents:
  - student_rights_toward_adviser
  - advising_confidentiality
  - entitlement_to_adviser_help_with_add_and_drop
  excluded_intents:
  - student_duties_toward_adviser
  - add_drop_deadline
  - grade_appeal_procedure
  - transcript_issuance_procedure
  - student_record_privacy_regulation
  why_excluded: enumerates what the student may expect FROM the adviser. Its add/drop right is an entitlement
    to help, not a window; and its confidentiality sentence is the advising unit's own commitment, not
    the university's records-release regulation
- policy_id: TU.ADVISING.TOOLS
