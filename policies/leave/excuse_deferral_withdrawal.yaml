- policy_id: TU.DEFERRAL.MAXIMUM
  topic: study_deferral
  title_ar: الحد الأقصى لمدة التأجيل
  authority_level: OFFICIAL_STUDENT_GUIDE
  source: { document_id: TU_STUDENT_GUIDE_V3_1447, page: 24 }
  source_text_ar: >
    ألا تتجاوز مدة التأجيل فصلين دراسيين متتاليين أو ثلاثة فصول دراسية غير متتالية
    حد أقصى طيلة بقائه في الجامعة، في حال الضرورة الاستثناء من ذلك.
  rule_type: limit
  limits:
    - { pattern: CONSECUTIVE, max_value: 2, unit: semesters }
    - { pattern: NON_CONSECUTIVE, max_value: 3, unit: semesters }
  scope: entire_enrolment_period
  exceptions:
    - { condition: NECESSITY, authority: UNIVERSITY_COUNCIL, note: "الاستثناء من ذلك في حال الضرورة" }
  required_inputs: [deferral_history, deferral_consecutiveness]
  source_edition: "1447"
  policy_effective_from: null
  policy_effective_to: null
  currentness_status: UNVERIFIED
  verification: *v_extracted
  extraction_confidence: high
  runtime_use: PROHIBITED_FOR_DECISION
  runtime_use_reason: >
    Needs deferral_history (absent) AND event ordering to tell CONSECUTIVE from
    NON_CONSECUTIVE (structurally absent — actual_term empty on all 159,778 rows).
    Two independent blockers; supplying the history alone would not unblock it.

