# Source page 24 presents الاعتذار / التأجيل / الانسحاب من مقرر as ONE three-column
# comparison table. The contrast IS the content — students confuse these three, and
# the distinction that matters (does the period count toward the graduation clock?)
# is only visible across columns. The comparison record below is therefore a
# first-class record, not a summary of the others.

