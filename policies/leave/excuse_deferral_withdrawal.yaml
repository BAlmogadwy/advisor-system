- policy_id: TU.WITHDRAWAL.MAXIMUM
  topic: course_withdrawal
  title_ar: الحد الأقصى لعدد الانسحابات
  authority_level: OFFICIAL_STUDENT_GUIDE
  source: { document_id: TU_STUDENT_GUIDE_V3_1447, page: 24 }
  source_text_ar: >
    يسمح للطالب بخمسة انسحابات فقط خلال كامل فترة التحاقه بالجامعة وبنفس الرقم
    الجامعي.
  rule_type: limit
  max_value: 5
  unit: withdrawals
  scope: entire_enrolment_period
  scope_qualifier: same_university_id
  required_inputs: [previous_withdrawal_count]
  source_edition: "1447"
  policy_effective_from: null
  policy_effective_to: null
  currentness_status: UNVERIFIED
  verification: *v_extracted
  extraction_confidence: high
  runtime_use: PROHIBITED_FOR_DECISION
  runtime_use_reason: >
    previous_withdrawal_count is MISSING. Course withdrawal leaves no trace in
    StudentCourse (statuses are passed / studying / not_taken only). Student.status
    values FINAL WITHDRAWN / EXCUSED WITHDRAWN describe withdrawal from the
    UNIVERSITY, not from a course, and must not be substituted for this counter.

- policy_id: TU.WITHDRAWAL.MINIMUM_LOAD_BAR
  topic: course_withdrawal
  title_ar: منع الانسحاب إذا نزل العبء عن الحد الأدنى
  authority_level: OFFICIAL_STUDENT_GUIDE
  source: { document_id: TU_STUDENT_GUIDE_V3_1447, page: 24 }
  source_text_ar: >
    لا يسمح للطالب الانسحاب في حال كان العبء الدراسي أقل من الحد الأدنى للعبء
    الدراسي بعد تنفيذ الانسحاب.
  rule_type: eligibility
  condition:
    field: credits_after_withdrawal
    operator: ">="
    value_from_policy: TU.LOAD.SEMESTER_RANGE.min_value
  result_if_false: NOT_ELIGIBLE
  required_inputs: [registered_credits_this_term, course_credits, study_system]
  source_edition: "1447"
  policy_effective_from: null
  policy_effective_to: null
  currentness_status: UNVERIFIED
  verification: *v_extracted
  extraction_confidence: high
  notes: >
    The only one of the four withdrawal bars whose inputs plausibly exist
    (current_registered_credits + course credit_hours). Still gated by dataset
    freshness — see the coverage matrix.

