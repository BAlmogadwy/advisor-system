- policy_id: TU.CONDUCT.VIOLATION_TYPES
  topic: student_conduct
  title_ar: أنواع المخالفات الطلابية
  authority_level: OFFICIAL_STUDENT_GUIDE
  source: { document_id: TU_STUDENT_GUIDE_V3_1447, page: 38 }
  source_text_ar: >
    الإخلال بنظام الكليات أو مرافق الجامعة الأخرى، أو تعطيل سير النشاط بأي صورة
    كانت؛ الإخلال بنظام المحاضرات أو الدروس العلمية، أو الامتناع عن حضورها؛
    الإخلال بنظام الاختبارات بالغش أو محاولة الغش؛ القيام بأي فعل يمس الدين أو
    يخل بحسن السيرة والسلوك، أو المساس بسمعة الجامعة؛ الاعتداء على منسوبي الجامعة
    موظفين أو طلاب أو إهانتهم؛ التعديل والتغيير في الأوراق الرسمية أو الإدلاء
    بمعلومات غير صحيحة عن الجامعة؛ امتناع الطالب عن الامتثال للعقوبة التي تقرر من
    الجهات المختصة.
  rule_type: enumeration
  governed_by: "لائحة السلوك والانضباط الطلابي"
  source_edition: "1447"
  policy_effective_from: null
  policy_effective_to: null
  currentness_status: UNVERIFIED
  verification: &v_approved
    status: AUTHORITY_APPROVED
