- policy_id: TU.VISITING.NO_TRANSFER_DURING_VISIT
  topic: visiting_student
  title_ar: منع طلب التحويل أثناء فترة الزيارة
  authority_level: OFFICIAL_STUDENT_GUIDE
  source: { document_id: TU_STUDENT_GUIDE_V3_1447, page: 31 }
  source_text_ar: >
    لا يسمح للطالب طلب التحويل خلال فترة زيارته داخل أو خارج الجامعة.
  rule_type: eligibility
  blocks: [TU.TRANSFER.INTERNAL_COLLEGE, TU.TRANSFER.DEPARTMENT_OR_MAJOR, TU.TRANSFER.EXTERNAL]
  source_edition: "1447"
  policy_effective_from: null
  policy_effective_to: null
  currentness_status: UNVERIFIED
  verification: *v_approved
  extraction_confidence: high
  runtime_use: PARTIALLY_EVALUABLE
  runtime_use_note: >
    Student.status carries 'VISITOR TO ANOTHER UNIVERSITY' (22 students) and
    'VISITOR INACTIVE' (7). That is a CURRENT-state flag of unknown freshness — it
    supports flagging the bar as likely applicable, never a definitive verdict.

- policy_id: TU.VISITING.MAX_VISITS
  topic: visiting_student
  title_ar: الحد الأقصى لمرات الزيارة
