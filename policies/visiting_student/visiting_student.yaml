- policy_id: TU.VISITING.COURSE_EQUIVALENCE
  topic: visiting_student
  title_ar: معادلة المقرر المدروس خارج الجامعة
  authority_level: OFFICIAL_STUDENT_GUIDE
  source: { document_id: TU_STUDENT_GUIDE_V3_1447, page: 31 }
  source_text_ar: >
    أن يكون المقرر الذي يدرسه الطالب خارج الجامعة معادلاً أو (مكافئاً) في مفرداته
    لأحد المقررات التي تتضمنها متطلبات التخرج.
  rule_type: eligibility
  condition: { field: syllabus_equivalent_to_graduation_requirement_course, operator: "==", value: true }
  source_edition: "1447"
  policy_effective_from: null
  policy_effective_to: null
  currentness_status: UNVERIFIED
  verification: *v_approved
  extraction_confidence: high

- policy_id: TU.VISITING.GPA_INCLUSION
  topic: visiting_student
  title_ar: احتساب مقررات الطالب الزائر ضمن المعدل التراكمي
  authority_level: OFFICIAL_STUDENT_GUIDE
  source: { document_id: TU_STUDENT_GUIDE_V3_1447, page: 31 }
  source_text_ar: >
    لا تحتسب معدلات المقررات التي تتم معادلتها للطالب الزائر من جامعة أخرى ضمن
    معدله التراكمي، وتثبت المقررات في سجله الأكاديمي، ويمكن احتسابها ضمن المعدل
    التراكمي في حال استيفاء الآتي: أن تكون مفردات المقرر المُعادل مطابقة لمفردات
    المقرر الذي يُقدمه القسم؛ أن تكون لغة دراسة المقرر مطابقة للغة دراسة المقرر
    الذي يُقدمه القسم؛ ألا يقل تقدير المقرر المعادل عن (جيد جداً).
  rule_type: conditional_consequence
  default: EXCLUDED_FROM_GPA_BUT_RECORDED_ON_TRANSCRIPT
  included_in_gpa_if_all:
    - { field: syllabus_identical, operator: "==", value: true }
    - { field: language_of_instruction_identical, operator: "==", value: true }
    - { field: grade_at_least, operator: ">=", value: "جيد جداً" }
  source_edition: "1447"
  policy_effective_from: null
  policy_effective_to: null
  currentness_status: UNVERIFIED
  verification: *v_approved
  extraction_confidence: high
  cross_references: [TU.GPA.GENERAL_ESTIMATE_BANDS]
  notes: >
    "ألا يقل عن جيد جداً" resolves against TU.GRADE.SCALE to a course weight of
    4.00 of 5 (80%+), not against the cumulative-GPA bands. State the band name
    rather than a derived number until a domain reviewer confirms which table applies.
  open_question: which_table_governs_جيد_جداً_here

- policy_id: TU.VISITING.MAX_UNITS_OUTSIDE
  topic: visiting_student
  title_ar: الحد الأقصى للوحدات كطالب زائر خارج الجامعة
  authority_level: OFFICIAL_STUDENT_GUIDE
  source: { document_id: TU_STUDENT_GUIDE_V3_1447, page: 31 }
  source_text_ar: >
    لا يزيد الحد الأقصى للوحدات الدراسية التي يسمح للطالب بدراستها كطالب زائر خارج
    الجامعة عن ٢٥٪ من عدد الوحدات المطلوبة للتخرج.
  rule_type: limit
  max_value: 25
  unit: percent_of_graduation_units
  location: OUTSIDE_UNIVERSITY
  required_inputs: [units_studied_as_visitor_outside, graduation_units_required]
  source_edition: "1447"
  policy_effective_from: null
  policy_effective_to: null
  currentness_status: UNVERIFIED
  verification: *v_approved
  extraction_confidence: high
  runtime_use: PROHIBITED_FOR_DECISION
  runtime_use_reason: >
    graduation_units_required IS derivable from ProgrammeRequirement, but
    units_studied_as_visitor_outside is MISSING — StudentCourse carries no
    institution-of-origin marker, so visited units are indistinguishable from
    home units. Half the ratio is computable, which is not enough.

