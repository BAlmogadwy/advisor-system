  policy_effective_from: null
  policy_effective_to: null
  currentness_status: UNVERIFIED
  verification: *v_approved
  extraction_confidence: high
  runtime_use: PROHIBITED_FOR_DECISION
  runtime_use_reason: visit_count is MISSING — only a current-state flag exists
  cross_references: [TU.REENROLMENT.LAPSED_BECOMES_NEW_APPLICANT]
