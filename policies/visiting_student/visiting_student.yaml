- policy_id: TU.VISITING.DEFINITION
  topic: visiting_student
  title_ar: الطالب الزائر
  authority_level: OFFICIAL_STUDENT_GUIDE
  source: { document_id: TU_STUDENT_GUIDE_V3_1447, page: 31 }
  source_text_ar: >
    يجوز للطالب/ـة -بعد موافقة الكلية التي يدرس فيها- دراسة مقرر دراسي أو أكثر في
    جامعة أخرى داخل المملكة أو خارجها، أو في فرع من فروع الجامعة التي ينتمي إليها
    دون تحويله، على أن تكون دراسته متزامنة مع دراسته في جامعته أو كطالب زائر،
    وتعادل له المقررات الدراسية التي درسها، وتُثبَّت المقررات التي تم معادلتها في
    السجل الأكاديمي، ويحدد مجلس الجامعة الضوابط المنظمة لذلك.
  rule_type: definition
  requires_approval: [HOME_COLLEGE]
  approval_covers: [visit_request, list_of_courses_to_be_studied]
  source_edition: "1447"
  policy_effective_from: null
  policy_effective_to: null
  currentness_status: UNVERIFIED
  verification: &v_approved
    status: AUTHORITY_APPROVED
    extracted_by: agent
    extracted_at: "2026-08-01"
    source_verified_by: project_owner
    source_verified_at: "2026-08-01"
    domain_reviewed_by: project_owner
    domain_reviewed_at: "2026-08-01"
    authority_approved_by: project_owner
    authority_approved_at: "2026-08-01"
    approval_basis: >
      Owner instruction 2026-08-01. The project owner is acting as the authority for this
      system's own use of these records. This is NOT a statement that the Deanship of
      Admission and Registration has reviewed them, and it does not resolve any
      open_question or contested marker — those survive approval unchanged.
  extraction_confidence: high
  notes: >
    Answers Q95. Note the college must approve BOTH the visit and the specific
    course list — students commonly assume only the former.

