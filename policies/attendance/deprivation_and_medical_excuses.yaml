- policy_id: TU.MEDICAL_EXCUSE.ACCEPTED_ISSUERS
  topic: medical_excuse
  title_ar: الجهات المقبولة لإصدار العذر المرضي
  authority_level: OFFICIAL_STUDENT_GUIDE
  source: { document_id: TU_STUDENT_GUIDE_V3_1447, page: 33 }
  source_text_ar: >
    يعتمد قبول الأعذار المرضية بشرط تقديم تقرير طبي صادر من المنصة الرسمية (منصة
    صحة) أو الإدارة الطبية بالجامعة، أو المستشفى الجامعي.
  rule_type: eligibility
  accepted_issuers:
    - "منصة صحة"
    - "الإدارة الطبية بالجامعة"
    - "المستشفى الجامعي"
  source_edition: "1447"
  policy_effective_from: null
  policy_effective_to: null
  currentness_status: UNVERIFIED
  verification: *v_approved
  extraction_confidence: high
  notes: >
    Answers Q198 ("تقرير من مستشفى خاص") by exclusion: a private hospital is not on
    the accepted-issuer list. State the list; do not assert a blanket refusal that
    the source does not word that way.

