- policy_id: TU.MEDICAL_EXCUSE.SUBMISSION_WINDOW
  topic: medical_excuse
  title_ar: مهلة تقديم التقرير الطبي
  authority_level: OFFICIAL_STUDENT_GUIDE
  source: { document_id: TU_STUDENT_GUIDE_V3_1447, page: 33 }
  source_text_ar: >
    تقدم التقارير الطبية أو الأعذار الأخرى الموثقة لوكيل الكلية المختص في فترة لا
    تزيد عن أسبوعين فقط من تاريخ إصدارها.
  rule_type: limit
  max_value: 2
  unit: weeks
  clock_starts_at: REPORT_ISSUE_DATE
  submitted_to: COLLEGE_VICE_DEAN
  source_edition: "1447"
  policy_effective_from: null
  policy_effective_to: null
  currentness_status: UNVERIFIED
  verification: *v_approved
  extraction_confidence: high
  notes: >
    Answers Q199 ("فاتني موعد تقديم العذر"). Note the clock runs from the report's
    ISSUE date, not from the absence — a distinction students routinely get wrong.

- policy_id: TU.MEDICAL_EXCUSE.EFFECT_ON_ASSESSMENTS
  topic: medical_excuse
  title_ar: أثر العذر المرضي على الاختبارات والأعمال الفصلية
  authority_level: OFFICIAL_STUDENT_GUIDE
  source: { document_id: TU_STUDENT_GUIDE_V3_1447, page: 33 }
  source_text_ar: >
    إذا كانت فترة التقرير الطبي المعتمد تشمل اختباراً دورياً أو أعمالاً فصلية،
    فيتم التنسيق مع رئيس القسم وأستاذ المقرر لإعطاء اختبار بديل أو استكمال
    الأعمال الفصلية للطالب في مدة لا تتجاوز بدء الاختبارات النهائية. وإذا كانت
    فترة التقرير تشمل اختباراً نهائياً فيتم إعادة الاختبار النهائي للطالب وفق
    الضوابط المحددة.
  rule_type: procedure
  branches:
    - covers: [PERIODIC_EXAM, COURSEWORK]
      remedy: ALTERNATIVE_EXAM_OR_COMPLETION
      coordinated_by: [DEPARTMENT_HEAD, COURSE_INSTRUCTOR]
      deadline: BEFORE_FINAL_EXAMS_BEGIN
    - covers: [FINAL_EXAM]
      remedy: FINAL_EXAM_REPEATED
      governed_by: "الضوابط المحددة"
  source_edition: "1447"
  policy_effective_from: null
  policy_effective_to: null
  currentness_status: UNVERIFIED
  verification: *v_approved
  extraction_confidence: high
  notes: Answers Q54 ("غبت عن الاختبار بعذر").
  open_question: >
    "وفق الضوابط المحددة" for the final-exam case is undefined in the guide.
    Resolve against TU_EXECUTIVE_RULES.
