- policy_id: TU.ATTENDANCE.AUTO_REGISTRATION_TRAP
  topic: attendance
  title_ar: التسجيل الآلي لمن لم يسجل مبكراً وأثره على الحرمان
  authority_level: OFFICIAL_STUDENT_GUIDE
  source: { document_id: TU_STUDENT_GUIDE_V3_1447, page: 37 }
  source_text_ar: >
    تقوم عمادة القبول والتسجيل بالتسجيل آلياً للطلاب الذين لم يسجلوا مقرراتهم في
    التسجيل المبكر بأنفسهم، فيعتقد الطالب/ـة أنه لا يجب عليه الحضور ودراسة
    المقررات المسجلة آلياً ولا يحضر المحاضرات، فيتم رصد درجة حرمان له في نهاية
    الفصل، حيث كان يتوجب على الطالب/ـة الاعتذار عن الفصل إذا أراد التوقف عن
    الدراسة لذلك الفصل الدراسي.
  rule_type: advisory_warning
  listed_under: "أخطاء متكررة"
  source_edition: "1447"
  policy_effective_from: null
  policy_effective_to: null
  currentness_status: UNVERIFIED
  verification: *v_approved
  extraction_confidence: high
  notes: >
    The source's own "common mistakes" page. High advisory value: it names a
    specific, frequent, and costly student misconception. Worth surfacing
    proactively rather than only on request.

