# Policy source registry.
#
# Every policy record cites a document_id declared here. A source is identified by
# its SHA-256, so a replaced PDF cannot silently keep the same identity — if the
# file changes, the hash changes, and every record citing it must be re-verified.
#
# authority_precedence is the resolution order when two active sources disagree.
# A lower-level source may EXPLAIN a rule; it may never override a higher one.

authority_precedence:
  - UNIVERSITY_REGULATION        # لائحة الدراسة والاختبارات للمرحلة الجامعية
  - UNIVERSITY_EXECUTIVE_RULES   # القواعد التنفيذية لجامعة طيبة
  - UNIVERSITY_DECISION          # قرارات مجلس الجامعة المعدِّلة
  - OFFICIAL_ACADEMIC_CALENDAR   # التقويم الجامعي
  - OFFICIAL_STUDENT_GUIDE       # الدليل الإرشادي للطالب والطالبة
  - COLLEGE_PROCEDURE
  - DEPARTMENT_GUIDANCE

sources:
  - document_id: TU_STUDENT_GUIDE_V3_1447
    title_ar: الدليل الإرشادي للطالب والطالبة
    title_en: Student Advising Guide
    publisher_ar: جامعة طيبة — عمادة القبول والتسجيل
    authority_level: OFFICIAL_STUDENT_GUIDE
    version: "3"
    edition_ar: الإصدار الثالث
    effective_from: "1447"
    effective_to: null
    status: ACTIVE
    page_count: 40
    file: sources/TU_STUDENT_GUIDE_V3_1447.pdf
    file_sha256: "155b7df5ec782860cc047287919e2dcfbe78aa76759b9f0bed105bcad0a15227"
    obtained_at: "2026-08-01"
    obtained_from: owner_supplied
    reviewed_by: null
    reviewed_at: null
    # The guide is a SUMMARISING source. Page 14 ("أدوات الإرشاد الأكاديمي") itself
    # points at the regulation it summarises, via QR code. It therefore sits BELOW
    # the regulation and the executive rules in authority_precedence, and any record
    # extracted from it is provisional until checked against those.
    summarises:
      - TU_UNDERGRAD_REGULATION      # not yet obtained
      - TU_EXECUTIVE_RULES           # not yet obtained
    notes: >
      Chapter 1 (pp. 4-21) is largely descriptive — what advising is, rights and
      duties, contact channels. The normative content is Chapter 2 (pp. 23-38).
      Extraction covers both, but only Chapter 2 yields enforceable rule records.

  - document_id: TU_ACADEMIC_CALENDAR_1448_T1
    title_ar: التقويم الأكاديمي — الفصل الدراسي الأول 1448هـ
    publisher_ar: جامعة طيبة
    authority_level: OFFICIAL_ACADEMIC_CALENDAR
    status: ACTIVE
    covers_term: { academic_year_hijri: "1448", term: 1 }
    file: sources/TU_ACADEMIC_CALENDAR_1448_T1.html
    file_sha256: "d6297a4dd1eea5f4328274247c2a82cdb1dd9d20c1f2fae01356bebb768ad05d"
    extracted_to: calendar/calendar_1448_t1.yaml
    obtained_at: "2026-08-01"
    obtained_from: owner_supplied_page_capture
    reviewed_by: null
    reviewed_at: null
    # Ranks ABOVE the student guide in authority_precedence. Where the two disagree
    # on a date, this wins — see conflicts below.
    outranks: [TU_STUDENT_GUIDE_V3_1447]
    scope_limit: >
      SINGLE TERM. Covers الفصل الدراسي الأول 1448هـ only (Aug 2026 - Jan 2027).
      Says nothing about term 2, the summer term, or any other year. A deadline
      question outside that span remains UNANSWERABLE — do not extrapolate.
    capture_risk: >
      Captured from a LIVE page, not an archival PDF. The university can change it
      without notice and without changing any identifier. Re-capture before relying
      on it in a later term; the hash above identifies this capture, not the page.

# Where two ACTIVE sources disagree. Resolved by authority_precedence, never by
# editing either record — both readings stay visible.
conflicts:
  - id: CONFLICT.ADD_DROP_DEADLINE
    detected_at: "2026-08-01"
    subject: when registration changes close
    lower_authority:
      document_id: TU_STUDENT_GUIDE_V3_1447
      page: 20
      policy_id: TU.REG.CHANGES_CLOSE_ONE_WEEK_BEFORE
      says: >
        "تنتهي كافة إجراءات التسجيل قبل بدء الدراسة بأسبوع ولا يحق للطالب إجراء
        أية تعديلات على اختياراته" — a full week before teaching starts.
    higher_authority:
      document_id: TU_ACADEMIC_CALENDAR_1448_T1
      says: >
        الحذف والإضافة عبر بوابة الطالب: 20-22 أغسطس 2026.
        بداية الدراسة للفصل الدراسي الأول: 23 أغسطس 2026.
        Add/drop closes ONE DAY before teaching starts, not seven.
    resolution: >
      The calendar governs. OFFICIAL_ACADEMIC_CALENDAR outranks
      OFFICIAL_STUDENT_GUIDE. Answers about term 1 of 1448 must quote the calendar
      dates; the guide's "بأسبوع" must not be repeated as the operative rule.
    incidentally_resolves: >
      TU.REG.CHANGES_CLOSE_ONE_WEEK_BEFORE carried an open_question asking whether
      "تنتهي كافة إجراءات التسجيل" foreclosed the الحذف والإضافة window too. The
      calendar answers it: it does not — add/drop runs AFTER the guide's stated
      cut-off and immediately before teaching begins.
    caveat: >
      Observed for ONE term. Whether the guide's week-long rule is simply wrong, or
      was correct for an earlier calendar, cannot be told from a single capture.
      Confirm against TU_UNDERGRAD_REGULATION before generalising.

