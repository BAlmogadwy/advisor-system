- policy_id: TU.LOAD.SEMESTER_RANGE
  topic: credit_load
  title_ar: الحد الأدنى والأعلى للعبء الدراسي في الفصل الرئيس
  authority_level: OFFICIAL_STUDENT_GUIDE
  source: { document_id: TU_STUDENT_GUIDE_V3_1447, page: 23 }
  source_text_ar: >
    الحد الأدنى من العبء الدراسي للفصل الرئيس في نظام الفصلين الدراسيين هو (12)
    وحدات دراسية والحد الأعلى هو (19) وحدة دراسية.
  rule_type: range
  applies_to: { study_system: TWO_SEMESTER, term_type: MAIN }
  min_value: 12
  max_value: 19
  unit: credit_units
  required_inputs: [registered_credits_this_term, study_system, term_type]
  source_edition: "1447"
  policy_effective_from: null
  policy_effective_to: null
  currentness_status: UNVERIFIED
  supersedes: null
  verification: &v_approved
    status: AUTHORITY_APPROVED
    extracted_by: agent
    extracted_at: "2026-08-01"
    source_verified_by: project_owner
    source_verified_at: "2026-08-01"
    domain_reviewed_by: project_owner
    domain_reviewed_at: "2026-08-01"
    authority_approved_by: project_owner
    authority_approved_at: "2026-08-01"
    approval_basis: >
      Owner instruction 2026-08-01. The project owner is acting as the authority for this
      system's own use of these records. This is NOT a statement that the Deanship of
      Admission and Registration has reviewed them, and it does not resolve any
      open_question or contested marker — those survive approval unchanged.
  extraction_confidence: high
  # CONFLICT WITH RUNNING CODE — do not silently reconcile.
  conflicts_with_implementation:
    location: core/services/recommender.py:9
    symbol: MAX_CREDITS
    implementation_value: 18
    policy_value: 19
    exposed_to_students_as: max_term_credit_hours
    impact: >
      The virtual adviser currently publishes a per-term ceiling one unit BELOW the
      guide's. Either 18 is a deliberate local rule (then it needs its own source
      record and must not be presented as the university limit), or it is a defect.
    resolution: OWNER_DECISION_REQUIRED

- policy_id: TU.LOAD.FULL_YEAR_RANGE
  topic: credit_load
  title_ar: العبء الدراسي في نظام السنة الدراسية الكاملة
  authority_level: OFFICIAL_STUDENT_GUIDE
  source: { document_id: TU_STUDENT_GUIDE_V3_1447, page: 23 }
  source_text_ar: >
    الحد الأدنى من العبء الدراسي للسنة الدراسية في نظام السنة الدراسية الكاملة هو
    (٢٤) وحدة دراسية والحد الأعلى هو (٣٩) وحدة دراسية.
  rule_type: range
  applies_to: { study_system: FULL_YEAR }
  min_value: 24
  max_value: 39
  unit: credit_units
  required_inputs: [registered_credits_this_year, study_system]
  source_edition: "1447"
  policy_effective_from: null
  policy_effective_to: null
  currentness_status: UNVERIFIED
  verification: *v_approved
  extraction_confidence: high
  notes: >
    Not applicable to the 12 programmes currently modelled in this project, which
    all run on the two-semester system. Recorded for completeness of the source.

