- policy_id: TU.LOAD.EXPECTED_GRADUATE_REQUEST
  topic: credit_load
  title_ar: تسجيل الطالب المتوقع تخرجه
  authority_level: OFFICIAL_STUDENT_GUIDE
  source: { document_id: TU_STUDENT_GUIDE_V3_1447, page: 23 }
  source_text_ar: >
    ويحق للطالب المتوقع تخرجه تقديم طلب تسجيل مقررات بما لا يتجاوز (16) ساعة في
    الفصل الدراسي، وتنظر عمادة القبول والتسجيل في تلك الطلبات بشرط حصول الطالب
    على موافقة الكلية التي يدرس فيها.
  rule_type: exception
  max_value: 16
  unit: credit_hours
  requires_approval: [DEANSHIP_OF_ADMISSION_AND_REGISTRATION, COLLEGE]
  required_inputs: [is_expected_graduate, requested_credits]
  source_edition: "1447"
  policy_effective_from: null
  policy_effective_to: null
  currentness_status: UNVERIFIED
  verification: *v_approved
  extraction_confidence: low
  open_question: >
    Reads oddly as stated: 16 is BELOW the ordinary 19-unit ceiling in
    TU.LOAD.SEMESTER_RANGE, so "يحق له ... بما لا يتجاوز ١٦" is not obviously a
    concession. Possible readings: (a) it is a summer-term allowance raising the
    9-unit cap; (b) it is an overload path measured in contact HOURS not UNITS
    (the text says ساعة here, وحدة elsewhere); (c) the ceiling applies to some
    other condition compressed out of the summary.
    MUST be resolved against TU_UNDERGRAD_REGULATION before any runtime use.
  runtime_use: PROHIBITED_FOR_DECISION

- policy_id: TU.LOAD.INCOMPLETE_GRADE
  topic: credit_load
  title_ar: تقدير غير مكتمل (IC) واستكماله
  authority_level: OFFICIAL_STUDENT_GUIDE
  source: { document_id: TU_STUDENT_GUIDE_V3_1447, page: 23 }
  source_text_ar: >
    إذا لم ينجز الطالب متطلبات أي مقرر دراسي فإنه يسمح له باستكمال متطلبات المقرر
    بناء على توصية أستاذ المادة، ويحصل على تقدير غير مكتمل (IC) ولا يحسب ضمن
    المعدل الفصلي أو التراكمي وعلى الطالب إنهاء متطلباتها في الفصل التالي وإلا
    تحول إلى راسب في المادة.
  rule_type: procedure
  outcomes:
    - { condition: granted, effect: GRADE_IC_ASSIGNED, counted_in_gpa: false }
    - { condition: not_completed_next_term, effect: CONVERTS_TO_FAIL }
  requires_approval: [COURSE_INSTRUCTOR]
  required_inputs: [course_grade_symbol, term_sequence]
  source_edition: "1447"
  policy_effective_from: null
  policy_effective_to: null
  currentness_status: UNVERIFIED
  verification: *v_approved
  extraction_confidence: high
  notes: >
    Directly answers "الفرق بين محروم وراسب وغير مكتمل" class questions.
    Not evaluable per-student: grade symbols are absent from the database
    (StudentCourse.grade empty on all 159,778 rows) and there is no term ordering
    (actual_term empty on all rows), so "الفصل التالي" cannot be resolved.

- policy_id: TU.TERM.STRUCTURE
  topic: academic_structure
  title_ar: بنية العام الدراسي
  authority_level: OFFICIAL_STUDENT_GUIDE
  source: { document_id: TU_STUDENT_GUIDE_V3_1447, page: 23 }
  source_text_ar: >
    يقسم العام الدراسي إلى فصلين دراسيين لا تقل مدة الفصل عن (١٥) أسبوعاً لا يدخل
    ضمنها فترات التسجيل والحذف والإضافة والاختبارات النهائية وفصل صيفي اختياري لا
    تقل مدته عن ثمانية أسابيع.
  rule_type: definition
  facts:
    main_terms_per_year: 2
    min_main_term_weeks: 15
    min_summer_term_weeks: 8
    summer_optional: true
    weeks_exclude: [registration, add_drop, final_exams]
  source_edition: "1447"
  policy_effective_from: null
  policy_effective_to: null
  currentness_status: UNVERIFIED
  verification: *v_approved
  extraction_confidence: high
