    <div id="eligibility" class="panel" role="region">
      <div class="filter-bar fb-fit sticky-cta mb-14">
        <div class="fb-search"><span class="i i-sm flex-shrink-0"><svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></span><input id="elCourse" class="fb-w-12ch" placeholder="{% if LANGUAGE_CODE == 'ar' %}رمز المقرر{% else %}Course code{% endif %}" aria-label="{% if LANGUAGE_CODE == 'ar' %}رمز المقرر{% else %}Course code{% endif %}"></div>
        <div class="fb-search"><input id="elSection" class="fb-w-9ch" placeholder="{% if LANGUAGE_CODE == 'ar' %}الشعبة{% else %}Section{% endif %}" aria-label="{% if LANGUAGE_CODE == 'ar' %}الشعبة{% else %}Section{% endif %}"></div>
        <div class="fb-search"><input id="elProgram" class="fb-w-9ch" placeholder="{% if LANGUAGE_CODE == 'ar' %}البرنامج{% else %}Program{% endif %}" aria-label="{% if LANGUAGE_CODE == 'ar' %}البرنامج{% else %}Program{% endif %}"></div>
        <div class="fb-search"><input id="elJoin" class="fb-w-12ch" placeholder="{% if LANGUAGE_CODE == 'ar' %}سنوات الالتحاق{% else %}Join yrs{% endif %}" aria-label="{% if LANGUAGE_CODE == 'ar' %}سنوات الالتحاق{% else %}Join years{% endif %}"></div>
        {# The last field and the button wrap as one, so the button never sits alone on a line. #}
        <div class="fb-tail">
          <div class="fb-search"><select id="elMode" aria-label="{% if LANGUAGE_CODE == 'ar' %}وضع التأهيل{% else %}Eligibility mode{% endif %}"><option value="strict" selected>{% if LANGUAGE_CODE == 'ar' %}صارم (مجتاز + مكتسب فقط){% else %}Strict (passed + earned only){% endif %}</option><option value="relaxed">{% if LANGUAGE_CODE == 'ar' %}مرن (+ يدرس + مسجل){% else %}Relaxed (+ studying + registered){% endif %}</option></select></div>
          <div class="fb-actions">
            <button id="elRun" class="btn btn-primary">
              <span class="i i-sm" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></span>Check
            </button>
          </div>
        </div>
      </div>
      <div class="filter-bar filter-bar-sm mb-14">
        <div class="fb-spacer"></div>
        <button id="elCopyIds" type="button" class="fb-dd" title="{% if LANGUAGE_CODE == 'ar' %}نسخ أرقام الطلاب المؤهلين للصقها في صفحة التوافر الجماعي{% else %}Copy eligible IDs to paste into Group Availability{% endif %}"><span class="i i-sm" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></span>{% if LANGUAGE_CODE == 'ar' %}نسخ الأرقام{% else %}Copy IDs{% endif %}</button>
        <a id="elCsv" class="btn btn-sm btn-export" href="#"><span class="i i-sm" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></span>CSV</a>
      </div>
      <div id="elMeta" class="meta-banner meta-info meta-mono mb-14">No eligibility report loaded.</div>
      <div id="elSummary" class="page-summary d-none mb-18">
          <span class="ps-item mc-teal"><span class="ps-lbl">Eligible</span><span class="ps-val" id="elCount">0</span></span>
          <span class="ps-item mc-royal"><span class="ps-lbl">Mode</span><span class="ps-val" id="elModeBadge">strict</span></span>
          <span class="ps-item mc-sky"><span class="ps-lbl">Course</span><span class="ps-val" id="elCourseBadge">—</span></span>
        </div>
      <div class="tbl-section">
        <div class="tbl-header">
          <div class="tbl-title">Eligible Students <span class="tbl-cnt" id="elTableCnt">0</span></div>
        </div>
        <div class="overflow-x">
          <table class="tbl-card" id="elTable">
            <thead><tr><th scope="col">Eligible Student IDs</th></tr></thead>
            <tbody><tr><td><div class="empty-state"><span class="i empty-icon-muted"><svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></span><div class="empty-title">No eligibility results</div><div class="empty-hint">Enter a course code above, then click <strong>Check</strong></div></div></td></tr></tbody>
          </table>
        </div>
        <nav class="tbl-pager" id="elPager" aria-label="Eligibility table pagination"></nav>
      </div>
    </div>
