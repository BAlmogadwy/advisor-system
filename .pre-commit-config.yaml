repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.9
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.17.1
    hooks:
      - id: mypy
        additional_dependencies:
          - django-stubs==5.2.2
          - dj-database-url
          - python-dotenv

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        args: ["-c", ".bandit", "-r", "."]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      # policies/sources/ holds source documents verbatim — the university's own PDF
      # and calendar page. They are identified by SHA-256 in policies/sources.yaml and
      # the extractors refuse to run on a hash mismatch. A formatter appending a
      # newline changes that hash and invalidates the evidence, so these two hooks
      # must not touch them. (Caught exactly this way: end-of-file-fixer rewrote the
      # calendar HTML and extract_calendar.py refused to parse it.)
      - id: end-of-file-fixer
        exclude: ^policies/sources/
      - id: trailing-whitespace
        exclude: ^policies/sources/
  - repo: local
    hooks:
      # The dashboard is ONE classic <script>: a parse error anywhere in it
      # stops the whole file executing, so every panel dies at once — and the
      # Python suite stays green throughout, because pytest never parses JS.
      # That shipped once (a Python-style postfix `if` in page-dashboard.js).
      # node --check is the cheapest possible gate against a repeat.
      - id: js-syntax
        name: js parses (node --check)
        entry: node --check
        language: system
        files: ^static/js/.*\.js$
      - id: no-control-characters
        name: no control characters in source
        entry: python scripts/check_control_chars.py
        language: system
        types: [text]
        # Hash-pinned scraped evidence, like its two neighbours above: a
        # re-scrape carrying a form feed must not block commits on files
        # nobody may edit.
        exclude: ^policies/sources/
