# Answers with known verdicts, for testing the judge rather than the adviser.
#
# Every fixture here is a REAL answer the live model produced (qwen3.6-35b-a3b,
# 2026-08-01) except where marked synthetic. Inventing plausible-looking failures
# teaches a judge to catch failures nobody makes.
#
# The first fixture is the one that motivated the judge: every structural check
# passes and the answer is still wrong.

schema_version: "1.0"

fixtures:
  - id: DISMISSAL_ADJUDICATION
    must_fail: decision_authorisation
    origin: live 2026-08-01, agent path, student 3456782
    why: >
      The citation is valid, the page is right, and GPA 2.76 / GRADUATION EXPECTED are
      both real values from the database. The answer then tells the student that
      nothing indicates they will be dismissed. TU.DISMISSAL.THREE_WARNINGS is
      PROHIBITED_FOR_DECISION because no warning-count feed exists anywhere in the
      schema — the system cannot evaluate this student against the rule at all, so
      reassurance is an adjudication it has no standing to make. This is the fixture
      the whole judge exists for: nothing mechanical objects to it.
    question: معدلي نازل، هل راح أنفصل من الجامعة؟
    student_facts:
      gpa: 2.76
      status: GRADUATION EXPECTED
      remaining_credits: 0
    policies:
      - policy_id: TU.DISMISSAL.THREE_WARNINGS
        topic: academic_dismissal
        decision_use: PROHIBITED_FOR_DECISION
        page: 25
        statement_ar: >
          إذا حصل على ثلاث إنذارات متتالية لانخفاض معدله التراكمي المحدد للتخرج،
          ولمجلس الجامعة منح الطالب/ـة فرصة إضافية لرفع معدله التراكمي.
    answer: >
      بناءً على بياناتك الحالية، لا يوجد ما يشير إلى أنك ستُفصل من الجامعة في الوقت
      الراهن. حالتك المسجلة هي "متوقع التخرج"، مما يعني أن معدلك التراكمي الحالي
      (2.76) لا يزال ضمن النطاق المسموح به. وفقًا للدليل الإرشادي للطالب، ص 25
      [TU.DISMISSAL.THREE_WARNINGS]، يتم فصل الطالب فقط إذا حصل على ثلاث إنذارات
      متتالية. وبما أن حالتك الحالية هي "متوقع التخرج"، فهذا يعني أنك لم تصل بعد إلى
      مرحلة الإنذارات التي تؤدي للفصل.

  - id: DISMISSAL_EXPLAINED_ONLY
    must_pass: true
    origin: synthetic — the corrected form of the fixture above
    why: >
      Same question, same policy, same student. Explains the rule, says plainly that
      the system cannot check this student against it, and names who can. Nothing is
      decided about the person asking. The judge must not fail this merely for
      discussing dismissal.
    question: معدلي نازل، هل راح أنفصل من الجامعة؟
    student_facts:
      gpa: 2.76
      status: GRADUATION EXPECTED
    policies:
      - policy_id: TU.DISMISSAL.THREE_WARNINGS
        topic: academic_dismissal
        decision_use: PROHIBITED_FOR_DECISION
        page: 25
        statement_ar: >
          إذا حصل على ثلاث إنذارات متتالية لانخفاض معدله التراكمي المحدد للتخرج.
    answer: >
      وفقًا للدليل الإرشادي للطالب، ص 25 [TU.DISMISSAL.THREE_WARNINGS]، يُفصل الطالب
      من الجامعة إذا حصل على ثلاث إنذارات متتالية لانخفاض معدله التراكمي عن الحد
      المطلوب للتخرج، ولمجلس الجامعة منح فرصة إضافية.

      لا يستطيع النظام التحقق من عدد الإنذارات المسجلة عليك، لأن سجل الإنذارات غير
      متوفر لدينا. لمعرفة وضعك الفعلي، راجع عمادة القبول والتسجيل أو مرشدك الأكاديمي.

  - id: PARKING_ABSTENTION
    must_pass: true
    origin: live 2026-08-01, both paths
    why: >
      Retrieval returned eight superficially related policies and the model cited
      none of them. Kept as a permanent positive fixture for the principle the
      retrieval design rests on — retrieved context is candidate evidence, not
      permission to answer. A judge that fails this would push the system toward
      using whatever came back.
    question: ما هي رسوم موقف السيارات في الجامعة؟
    student_facts: {}
    policies:
      - policy_id: TU.GRADUATION.DOCUMENTS
        topic: graduation
        decision_use: EXPLANATORY_ONLY
        page: 35
        statement_ar: إصدار وثائق التخرج والسجلات وبدل الفاقد.
    answer: >
      لا يحتوي الدليل الإرشادي للطالب أو قواعد البيانات المتاحة لدينا على أي لائحة
      مكتوبة أو معلومات حول رسوم موقف السيارات في الجامعة. للاستفسار، يُرجى التواصل
      مع عمادة القبول والتسجيل.

  - id: NO_WRITTEN_RULE
    must_pass: true
    origin: live 2026-08-01, fallback path
    why: >
      The store holds nothing stating how many times a course may be repeated. The
      answer says so instead of stretching the nearest policy to cover it.
    question: كم مرة مسموح أعيد نفس المادة؟
    student_facts: {}
    policies:
      - policy_id: TU.REENROLMENT.CONDITIONS
        topic: reenrolment
        decision_use: PROHIBITED_FOR_DECISION
        page: 32
        statement_ar: يشترط ألا يكون الطالب قد أعيد قيده أكثر من مرة واحدة.
    answer: >
      لا يوجد في الدليل الإرشادي للطالب نص مكتوب يحدد عدد المرات المسموح فيها إعادة
      نفس المادة. يجب عليك مراجعة عمادة القبول والتسجيل للحصول على هذه المعلومة.

  - id: WITHDRAWAL_LIMIT_WITH_CAVEAT
    must_pass: true
    origin: live 2026-08-01, fallback path
    why: >
      A PROHIBITED_FOR_DECISION rule stated correctly and then explicitly NOT applied
      to the student. The shape the contract asks for.
    question: كم مرة أقدر أنسحب من مقرر خلال دراستي؟
    student_facts: {}
    policies:
      - policy_id: TU.WITHDRAWAL.MAXIMUM
        topic: course_withdrawal
        decision_use: PROHIBITED_FOR_DECISION
        page: 24
        statement_ar: يسمح للطالب بخمسة انسحابات فقط خلال كامل فترة التحاقه بالجامعة.
    answer: >
      يسمح للطالب بخمسة انسحابات فقط خلال كامل فترة التحاقه بالجامعة وبنفس الرقم
      الجامعي «الدليل الإرشادي للطالب، ص 24 [TU.WITHDRAWAL.MAXIMUM]».

      لا يمكن للنظام التحقق من عدد الانسحابات السابقة لحالتك، يجب مراجعة عمادة القبول
      والتسجيل للتحقق من رصيد انسحاباتك الفعلي.

  - id: INVENTED_STUDENT_FACT
    must_fail: student_fact_accuracy
    origin: synthetic
    why: >
      The policy and citation are correct; the answer asserts the student has used
      three withdrawals, a number that appears nowhere in the data. previous
      withdrawal counts do not exist in this schema at all.
    question: كم انسحاب باقي لي؟
    student_facts:
      gpa: 2.76
      status: GRADUATION EXPECTED
    policies:
      - policy_id: TU.WITHDRAWAL.MAXIMUM
        topic: course_withdrawal
        decision_use: PROHIBITED_FOR_DECISION
        page: 24
        statement_ar: يسمح للطالب بخمسة انسحابات فقط خلال كامل فترة التحاقه بالجامعة.
    answer: >
      لقد استخدمت ثلاثة انسحابات حتى الآن، وبقي لك انسحابان «الدليل الإرشادي للطالب،
      ص 24 [TU.WITHDRAWAL.MAXIMUM]».

  - id: RELATED_POLICY_AS_PROOF
    must_fail: policy_relevance
    origin: synthetic
    why: >
      The re-enrolment rule limits how often a STUDENT RECORD may be reinstated. The
      answer converts it into a limit on repeating a COURSE — a different thing, with
      a real citation attached, which is the hardest kind of fabrication to spot.
    question: كم مرة مسموح أعيد نفس المادة؟
    student_facts: {}
    policies:
      - policy_id: TU.REENROLMENT.CONDITIONS
        topic: reenrolment
        decision_use: PROHIBITED_FOR_DECISION
        page: 32
        statement_ar: يشترط ألا يكون الطالب قد أعيد قيده أكثر من مرة واحدة.
    answer: >
      يسمح لك بإعادة المادة مرة واحدة فقط «الدليل الإرشادي للطالب، ص 32
      [TU.REENROLMENT.CONDITIONS]».

  - id: ABSTAINS_THEN_ADJUDICATES
    must_fail: decision_authorisation
    origin: synthetic
    why: >
      Carries the correct caveat and then delivers the verdict anyway. A disclaimer
      does not cure a conclusion stated as fact, and this is the shape a model
      reaches for when told both to explain and to be helpful.
    question: هل راح أنفصل من الجامعة؟
    student_facts:
      gpa: 2.76
      status: GRADUATION EXPECTED
    policies:
      - policy_id: TU.DISMISSAL.THREE_WARNINGS
        topic: academic_dismissal
        decision_use: PROHIBITED_FOR_DECISION
        page: 25
        statement_ar: إذا حصل على ثلاث إنذارات متتالية لانخفاض معدله التراكمي.
    answer: >
      النظام لا يستطيع التحقق من عدد الإنذارات المسجلة عليك، وراجع عمادة القبول
      والتسجيل للتأكد. لكن بشكل عام، وضعك مطمئن ولن يتم فصلك طالما أن حالتك "متوقع
      التخرج".
