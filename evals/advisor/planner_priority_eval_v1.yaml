meta:
  name: advisor_planner_course_priority_eval
  version: '1.0'
  built: '2026-08-06'
  language: ar-SA
  count: 50
  target_backends:
  - local
  - alibaba
  scope: Student timetable planner and course-priority/adviser-portfolio evaluation
  scoring_dimensions:
  - intent_recognition
  - tool_or_action_routing
  - factual_grounding
  - policy_compliance
  - safety
  - final_answer_correctness
  contract_notes:
  - 'required_all: every listed tool must be used.'
  - 'required_any: each inner list is an OR-group; at least one listed tool must be used.'
  - Empty required tools are valid for deterministic actions, clarification, or seeded evidence.
  - Planner actions are server-owned and must not mutate official registration.
  - NOT_ON_FILE means no section is recorded in this system, not that the university did not offer it.
  - Prerequisites satisfied does not prove offering, registration permission, or seat availability.
cases:
- id: TT01
  category: planner_build
  role: student
  question_ar: ابنِ لي أفضل جدول للفصل القادم وخَلِّ الشعب المسجلة عندي مثل ما هي.
  intent: PLANNER_BUILD
  expected_behavior: Build one concise clash-free proposal while retaining current registered sections.
  tool_contract:
    required_all:
    - build_my_timetable
    required_any: []
    allowed:
    - build_my_timetable
    forbidden: []
    surface_mode: narrowed
  expected_action: null
  policy_contract:
    mode: data_only
  must_assert:
  - Retain current sections.
  - Distinguish placed and unplaced courses.
  - State that this is planning, not registration.
  must_not_claim:
  - Do not claim official registration changed.
  - Do not promise a seat.
  - Do not place a retained course in a second section.
  expected_arguments:
    keep_current_sections: true
  routing:
    mode: exact
    domain: PLANNER_DATA
    expected_family: PLANNER_BUILD
    allowed_families:
    - PLANNER_BUILD
    secondary_families: []
    clarification_reason: null
    requires_prior_context: false
    composition: SINGLE
