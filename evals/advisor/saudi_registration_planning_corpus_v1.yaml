meta:
  name: saudi_registration_planning_prompt_corpus
  schema_version: 1
  corpus_version: "1.1.15"
  built: "2026-08-24"
  locale: ar-SA
  source: "Owner-supplied Saudi-Arabic student prompts, 2026-08-23."
  description: >-
    Registration, course-choice, drop, timetable-construction, and graduation-impact
    prompts preserved verbatim and paired with executable, locally grounded variants.
  execution_field: grounded_utterance_ar
  total_count: 108
  counts_by_kind:
    bullet: 104
    composite: 4
  counts_by_input_variant:
    literal_canary: 67
    placeholder_substituted: 30
    fixture_literal_substituted: 11
  invariants:
    - utterance_ar is the exact owner-supplied text and must not be rewritten.
    - grounded_utterance_ar contains no XXXX or YYYY placeholder.
    - Live evaluation must send grounded_utterance_ar, never utterance_ar.
    - All expected capabilities are read-only and cannot register, drop, reserve, or save.
    - Every case declares a strict canonical typed plan expected from V2.1.
    - Adjudicated acceptable_plans are explicit closed alternatives, never wildcard relaxations.
    - Compound-tool critical controls are bounded semantic values, never student identity or raw evidence.
  support_levels:
    supported: "The read-only capability surface can answer the academic question from recorded evidence."
    read_only_partial: "Recorded evidence can answer part of the question, but cannot prove live seats, portal permission, or perform a change."
    capability_gap: "The requested optimization or fact is not represented by the current capability/data contract."

