category_contracts:
  eligibility:
    primary_tools: [why_course_locked]
    boundary: "Prerequisite state is not live registration permission; recorded sections do not prove seats."
  prerequisites:
    primary_tools: [course_prerequisites, why_course_locked]
    boundary: "course_prerequisites is reverse lookup; why_course_locked owns personal and forward-unlock evidence."
  available:
    primary_tools: [my_progress, recommend_courses, my_timetable, recommend_feasible_course_addition]
    boundary: "Prerequisite-satisfied means academically open in recorded data, not offered or seat-available."
  priority:
    primary_tools: [my_progress]
    boundary: "Unlock-impact ranking is a planning heuristic, not university policy."
  add_one:
    primary_tools: [recommend_feasible_course_addition]
    boundary: "A feasible addition uses recorded timetable evidence but cannot prove a live seat or register the course."
  drop:
    primary_tools: [rank_current_course_drop_impact]
    boundary: "Scenarios are read-only and cannot withdraw from a course."
  current_review:
    primary_tools: [my_timetable, my_progress, policy_lookup, recommend_feasible_course_addition, rank_current_course_drop_impact, improve_current_timetable]
    boundary: "REGISTERED and EXPECTED_PLAN evidence must remain distinct."
  build:
    primary_tools: [build_timetable_proposal]
    boundary: "A proposal neither saves nor registers and ignores live seat capacity."
  pin:
    primary_tools: [build_timetable_proposal]
    boundary: "Pinned section labels constrain a read-only proposal only."
  accelerate:
    primary_tools: [graduation_progress, feasible_course_replacements, recommend_feasible_course_addition, improve_current_timetable]
    boundary: "Forecasts assume first-attempt passes and do not guarantee future offerings."
  what_if:
    primary_tools: [graduation_progress, course_choice_comparison, feasible_course_replacements, why_course_locked, recommend_feasible_course_addition]
    boundary: "Counterfactuals do not alter the record."
  composite:
    primary_tools: [build_timetable_proposal, my_progress, recommend_feasible_course_addition, rank_current_course_drop_impact, improve_current_timetable]
    boundary: "Decompose the request and preserve every read-only limitation."

