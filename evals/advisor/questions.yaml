  - { id: 170, c: C14, ar: هل الدرجة الجديدة تستبدل القديمة في المعدل؟ }
  - { id: 171, c: C14, ar: إذا نجحت بدرجة منخفضة، تنصحني أعيد المادة؟ }
  - { id: 172, c: C14, ar: وش المواد اللي أركز عليها عشان أطلع من التعثر؟ }
  - { id: 173, c: C14, ar: أنا متأخر عن دفعتي، كيف ألحق بالخطة؟ }
  - { id: 174, c: C14, ar: هل فيه خطة خاصة للطلاب المتعثرين؟ }
  - { id: 175, c: C14, ar: أقدر أسجل صيفي عشان أعوض التأخير؟ }
  - { id: 176, c: C14, ar: كم ترم ممكن أتأخر عن المدة النظامية؟ }
  - { id: 177, c: C14, ar: وش يصير إذا تجاوزت المدة النظامية؟ }
  - { id: 178, c: C14, ar: هل أحتاج تمديد مدة الدراسة؟ }
  - { id: 179, c: C14, ar: كيف أقدم طلب فرصة إضافية؟ }
  - { id: 180, c: C14, ar: هل ممكن أفصل أكاديمياً بسبب الرسوب؟ }
  - { id: 181, c: C15, ar: كم نسبة الغياب المسموح فيها؟ }
  - { id: 182, c: C15, ar: كيف أعرف عدد غياباتي في المادة؟ }
  - { id: 183, c: C15, ar: الدكتور سجلني غايب وأنا كنت حاضر. }
  - { id: 184, c: C15, ar: أقدر أعترض على غياب مسجل بالخطأ؟ }
  - { id: 185, c: C15, ar: عندي عذر طبي، وين أرفعه؟ }
  - { id: 186, c: C15, ar: هل العذر الطبي يلغي الغياب؟ }
  - { id: 187, c: C15, ar: غبت بسبب ظرف عائلي، هل يقبلون العذر؟ }
  - { id: 188, c: C15, ar: وش الأعذار الرسمية المقبولة؟ }
  - { id: 189, c: C15, ar: متى ينزل الحرمان في النظام؟ }
  - { id: 190, c: C15, ar: أقدر أختبر النهائي إذا وصلت نسبة الحرمان؟ }
  - { id: 191, c: C15, ar: هل المرشد يقدر يلغي الحرمان؟ }
  - { id: 192, c: C15, ar: مين صاحب الصلاحية في رفع الحرمان؟ }
  - { id: 193, c: C15, ar: انحرمت بسبب غياب العملي فقط، هل أرسب في المادة كاملة؟ }
  - { id: 194, c: C15, ar: تأخري عن المحاضرة ينحسب غياب؟ }
  - { id: 195, c: C15, ar: الدكتور ما حدث الحضور في النظام. }
  - { id: 196, c: C15, ar: كيف أقدم تظلم على الحرمان؟ }
  - { id: 197, c: C15, ar: هل الغياب في المحاضرات عن بُعد ينحسب؟ }
  - { id: 198, c: C15, ar: عندي تقرير طبي من مستشفى خاص، هل يُقبل؟ }
  - { id: 199, c: C15, ar: فاتني موعد تقديم العذر، وش أسوي؟ }
  - { id: 200, c: C15, ar: هل كثرة الغياب تأثر على المكافأة؟ }
