- id: 166
  c: C14
  ar: إذا رسبت في مادة ثلاث مرات وش يصير؟
- id: 167
  c: C14
  ar: أقدر أدرس المادة عند دكتور مختلف؟
- id: 168
  c: C14
  ar: هل إعادة المادة إلزامية إذا كانت اختيارية؟
- id: 169
  c: C14
  ar: رسبت في مادة اختيارية، أقدر آخذ بدالها مادة ثانية؟
- id: 170
  c: C14
  ar: هل الدرجة الجديدة تستبدل القديمة في المعدل؟
- id: 171
  c: C14
  ar: إذا نجحت بدرجة منخفضة، تنصحني أعيد المادة؟
- id: 172
  c: C14
  ar: وش المواد اللي أركز عليها عشان أطلع من التعثر؟
- id: 173
  c: C14
  ar: أنا متأخر عن دفعتي، كيف ألحق بالخطة؟
- id: 174
  c: C14
  ar: هل فيه خطة خاصة للطلاب المتعثرين؟
- id: 175
  c: C14
  ar: أقدر أسجل صيفي عشان أعوض التأخير؟
- id: 176
  c: C14
  ar: كم ترم ممكن أتأخر عن المدة النظامية؟
- id: 177
  c: C14
  ar: وش يصير إذا تجاوزت المدة النظامية؟
- id: 178
  c: C14
  ar: هل أحتاج تمديد مدة الدراسة؟
- id: 179
  c: C14
  ar: كيف أقدم طلب فرصة إضافية؟
- id: 180
  c: C14
  ar: هل ممكن أفصل أكاديمياً بسبب الرسوب؟
- id: 181
  c: C15
  ar: كم نسبة الغياب المسموح فيها؟
- id: 182
  c: C15
  ar: كيف أعرف عدد غياباتي في المادة؟
- id: 183
  c: C15
  ar: الدكتور سجلني غايب وأنا كنت حاضر.
- id: 184
  c: C15
  ar: أقدر أعترض على غياب مسجل بالخطأ؟
- id: 185
  c: C15
  ar: عندي عذر طبي، وين أرفعه؟
- id: 186
  c: C15
  ar: هل العذر الطبي يلغي الغياب؟
- id: 187
  c: C15
  ar: غبت بسبب ظرف عائلي، هل يقبلون العذر؟
- id: 188
  c: C15
  ar: وش الأعذار الرسمية المقبولة؟
- id: 189
  c: C15
  ar: متى ينزل الحرمان في النظام؟
- id: 190
  c: C15
  ar: أقدر أختبر النهائي إذا وصلت نسبة الحرمان؟
- id: 191
  c: C15
  ar: هل المرشد يقدر يلغي الحرمان؟
- id: 192
  c: C15
  ar: مين صاحب الصلاحية في رفع الحرمان؟
- id: 193
  c: C15
  ar: انحرمت بسبب غياب العملي فقط، هل أرسب في المادة كاملة؟
- id: 194
  c: C15
  ar: تأخري عن المحاضرة ينحسب غياب؟
- id: 195
  c: C15
  ar: الدكتور ما حدث الحضور في النظام.
- id: 196
  c: C15
  ar: كيف أقدم تظلم على الحرمان؟
- id: 197
  c: C15
  ar: هل الغياب في المحاضرات عن بُعد ينحسب؟
- id: 198
  c: C15
  ar: عندي تقرير طبي من مستشفى خاص، هل يُقبل؟
- id: 199
  c: C15
  ar: فاتني موعد تقديم العذر، وش أسوي؟
- id: 200
  c: C15
  ar: هل كثرة الغياب تأثر على المكافأة؟
- id: 201
  c: C16
  ar: كم مادة باقية لي في الخطة بالضبط؟
- id: 202
  c: C16
  ar: طيب أنا وين واصل؟ يعني كم نسبة اللي خلصته من الخطة وكم مقرر عديته لين الحين؟
- id: 203
  c: C16
  ar: وش المواد اللي أقدر أسجلها الحين على طول؟ يعني ما فيها متطلب سابق ناقص علي.
- id: 204
  c: C16
  ar: لو نجحت في مادة وحدة بس هذا الترم، أي وحدة تفتح لي أكثر مواد بعدها؟
- id: 205
  c: C16
  ar: خطتي تقول ما باقي لي إلا مقررين، يعني أنا صرت خريج ولا لسه؟
- id: 206
  c: C16
  ar: مشروع التخرج مقفل عندي مع إني خلصت كل المواد اللي قبله، ليه ما يفتح؟
- id: 207
  c: C16
  ar: كم مقرر مثبت عندي ناجح في السجل من خطتي، وش هي بالضبط؟
- id: 208
  c: C16
  ar: كم مقرر حر واختياري باقي علي في الخطة؟ وليش ما يطلع لي رمز مادة واضح لها؟
- id: 209
  c: C16
  ar: أبي أخلص بأسرع وقت ممكن، كم ترم أقل شي باقي لي وبأي مادة أبدأ؟
- id: 210
  c: C16
  ar: متى آخر موعد لطلب معادلة المقررات؟ ضروري أعرف لأن خطتي كلها تتغير عليه.
- id: 211
  c: C16
  ar: 'الأرقام ما تضبط معي أبد: النظام يقول ساعاتي المجتازة رقم، والخطة تقول باقي علي رقم ثاني ما يطابقه.
    يعني فيه خطأ عندكم؟'
- id: 212
  c: C16
  ar: أنا تخصصي IS وناجح في كل مواد المستوى الثامن، ليه IS491 مشروع التخرج ١ ما ينفتح لي في التسجيل؟
- id: 213
  c: C16
  ar: تخصصي AI2، عندي 140 ساعة مجتازة ومسجل 12 ساعة هالترم. أقدر أسجل AI492 الترم الجاي ولا لازم أنتظر
    سنة كاملة؟
- id: 214
  c: C16
  ar: زميلي في AI يقول AI492 مشروع تخرج وثلاث ساعات، وأنا في AI2 والخطة عندي تقول AI492 تدريب تعاوني وست
    ساعات. وش القصة؟ مين اللي غلطان فينا؟
- id: 215
  c: C16
  ar: وش بريركوزيت مادة أساسيات الذكاء الاصطناعي؟ صاحبي قال CS103 وبنت في الشعبة الثانية قالت CS163، مين
    الصح؟
- id: 216
  c: C16
  ar: أنا AI ومأجّل CS111 من زمان وناوي آخذها بالأخير مع مواد التخرج. طيب لو أجلتها، وش اللي بيتعطل علي
    بالضبط؟
- id: 217
  c: C16
  ar: أنا CYP وأبغى أسجل CS372 قواعد البيانات. صاحبي في CS يقول لازم CS211 قبلها وأنا ما وصلتها أصلاً.
    هل ينطبق علي نفس الشرط؟
- id: 218
  c: C16
  ar: تعبت صراحة، كل ما أحاول أسجل IS490 التدريب يطلع لي مرفوض. أنا مخلص 60 ساعة ومسجل 12 هالترم. ناقصني
    مواد ولا ناقصني ساعات؟
- id: 219
  c: C16
  ar: أنا CS2، كم مادة بيني وبين CS499 مشروع التخرج ٢؟ وإيش أقرب مادة على نفس السلسلة أقدر أسجلها الحين؟
- id: 220
  c: C16
  ar: المقرر الحر FE1 في خطتي، هل له متطلب سابق لازم أخلصه قبله ولا أقدر آخذه بأي ترم؟
- id: 221
  c: C16
  ar: أنا مسجل CS112 هالترم وما طلعت النتايج، أقدر أسجل CS211 الترم الجاي على أساس إني آخذها الحين ولا
    لازم أنتظر النتيجة؟
- id: 222
  c: C16
  ar: أنا COE2 وصاحبي CS2 وعندنا نفس عدد الساعات تقريباً 148، هو سجّل التدريب التعاوني وأنا النظام رفضني.
    ليه الفرق؟
- id: 223
  c: C16
  ar: أدور في خطتي على مشروع التخرج وما لقيت الاسم، فيه مادة اسمها GRADUATION I ساعة وحدة بس في المستوى
    التاسع. هذي هي؟ وإيش متطلباتها؟ أنا CS.
- id: 224
  c: C16
  ar: أنا AI في المستوى السادس ومفكر أأجل AI331 ترم واحد لأنها ثقيلة مع الباقي، هل تأجيلها يأخر تخرجي
    فعلياً ولا عادي؟
- id: 225
  c: C16
  ar: وش عندي بكرة الأحد؟
- id: 226
  c: C16
  ar: GS112 وين قاعتها؟ دورت في الجدول وما لقيت رقم قاعة.
- id: 227
  c: C16
  ar: أنا مسجل CS492 شعبة F48، متى ووين بالضبط؟ الجدول مكتوب فيه شي غريب مكان القاعة.
- id: 228
  c: C16
  ar: أبي أعرف دكتور IS482 ووقت المحاضرة، الشعبة M3.
- id: 229
  c: C16
  ar: في CS323 شعبة F8 يوم الأربعاء عندي المحاضرة وبعدها العملي على طول، وين كل وحدة؟
- id: 230
  c: C16
  ar: كم الفراغ بالضبط بين محاضراتي يوم الثلاثاء؟ أبيه بالدقيقة مو تقريب.
- id: 231
  c: C16
  ar: ليش CS112 شعبة M42 كل يوم بقاعة مختلفة؟ الأحد وين والثلاثاء وين والأربعاء وين؟
- id: 232
  c: C16
  ar: MGT324 كم ساعة معتمدة، ومتى محاضراتها ووين؟ أنا في الشعبة M2.
- id: 233
  c: C16
  ar: IS372 أنا في أي شعبة، وكم مرة تجي بالأسبوع وكم ساعة؟
- id: 234
  c: C16
  ar: قبل ما المرشد يعتمد تسجيلي، المفروض يتأكد من إيش بخصوص جدولي بالذات؟
- id: 235
  c: C16
  ar: جدولي ما فيه أسماء الدكاترة أصلاً — متى ينتهي إسناد الشعب لأعضاء هيئة التدريس؟
- id: 236
  c: C16
  ar: الجدول اللي تعرضه لي هذا لأي سنة وأي فصل بالضبط؟
- id: 237
  c: C16
  ar: كم انسحاب من مقرر مسموح لي طول دراستي؟ وأنا هذا أول ترم لي بالجامعة.
- id: 238
  c: C16
  ar: خلاص قررت أوقف ترم. كم مرة يسمحون لي أأجل طول ما أنا مسجل بالجامعة؟
- id: 239
  c: C16
  ar: قالوا لي المكافأة تنقطع على اللي يعتذر بس، وأنا مؤجل مو معتذر — يعني مكافأتي تنزل عادي صح؟
- id: 240
  c: C16
  ar: خطتي ثمانية فصول. أقصى شي أقدر أقعد كم فصل قبل ما يفصلوني على المدة؟
- id: 241
  c: C16
  ar: تعبت وقررت أسحب ملفي من الجامعة نهائي. وش الإجراءات المطلوبة ومتى آخر موعد في الفصل الأول؟
- id: 242
  c: C16
  ar: لو ما سجلت ولا مادة ترم كامل بدون تأجيل ولا اعتذار وش يصير لقيدي؟ وأنا الترم اللي قبله كنت زائر
    في جامعة ثانية، يحسبونه علي انقطاع؟
- id: 243
  c: C16
  ar: إذا اعتذرت عن الترم، وش اللي يطلع لي في كشف الدرجات؟
- id: 244
  c: C16
  ar: قعدت برا الجامعة أكثر من المدة المسموحة لإعادة القيد، يعني خلاص راح كل شي وما لي رجعة؟
- id: 245
  c: C16
  ar: صاحبي مفصول تأديبياً من جامعة ثانية ويبي يقدم عندنا إعادة قيد. يقدر ولا فيه مدة لازم تعدي أول؟
- id: 246
  c: C16
  ar: أنا مسجل هالترم كم ساعة؟ ولو انسحبت من مادة وحدة بينزل عبئي عن الحد الأدنى ولا لا؟
- id: 247
  c: C16
  ar: 'أنا فاهم إن الحرمان شيء إجرائي، بس سؤالي على المعدل بالضبط: رمز (ح) كم وزنه في حساب المعدل؟ ونفس
    وزن (هـ) الراسب ولا أخف منه؟'
- id: 248
  c: C16
  ar: في كشف الدرجات عندي رمز (ع) على ترم كامل. هذا معناه إني منسحب بعذر من مقرر، ولا معناه إني اعتذرت
    عن الفصل كله؟ وهل يحسب علي في المعدل؟
- id: 249
  c: C16
  ar: والله الدكتور ظلمني في درجة النهائي. كم يوم عندي أرفع فيها تظلم، ومن أي يوم يبدأ العد — من يوم أشوف
    الدرجة في النظام؟ وهل فيه شيء يرتد علي لو طلع تظلمي مالوش أساس؟
- id: 250
  c: C16
  ar: قدمت تظلم على درجة مادة، ورئيس القسم رد علي إن الدرجة صحيحة وأنا مو مقتنع أبداً. فيه جهة أعلى أراجعها
    ولا خلاص انتهى الموضوع؟ وكم يحتفظون بأوراقي؟
- id: 251
  c: C16
  ar: مادتي فيها ٣٠ محاضرة في الترم وأنا غايب ٦ محاضرات. كم باقي لي قبل ما ينزل علي حرمان؟ ولو انحرمت
    أقدر أواصل حضور وأدخل النهائي؟
- id: 252
  c: C16
  ar: تنويمي في المستشفى وقع على أسبوع الفاينل نفسه مو على النصفي. يعطوني اختبار بديل زي ما يسوون في الدوري
    ولا كيف الوضع؟
- id: 253
  c: C16
  ar: واحد من دفعتي انمسك ومعه ورقة في اختبار النصفي. يعني بس يرسب في المادة وخلاص؟
- id: 254
  c: C16
  ar: لجنة السلوك والانضباط وش تقدر توقع علي بالضبط؟ سمعت إن فيه خصم من درجات المادة، وسمعت إن الفصل من
    الجامعة ممكن يكون نهائي — صح هالكلام؟
- id: 255
  c: C16
  ar: 'خلصت مادتين هالترم: ٩٣٪ في مادة ٣ ساعات و٧٨٪ في مادة ساعتين. كم يطلع معدلي الفصلي من ٥؟ ابي الخطوات
    لا تعطيني الرقم بس.'
- id: 256
  c: C16
  ar: صدر بحقي قرار تأديبي في السنة الأولى وانتهى موضوعه من زمان. معدلي الآن ٤٫٨ من ٥ — يعطوني مرتبة الشرف
    الأولى ولا القرار يشيلني منها؟
- id: 257
  c: C16
  ar: درجتي في المادة طلعت ٩٥ بالضبط. أ+ ولا أ؟
- id: 258
  c: C16
  ar: عندي تقدير (ل) غير مكتمل من الفصل الثاني ١٤٤٧. متى آخر موعد أقدر أعدّله فيه؟ وإذا ما عدلته وش يصير
    عليه؟ وهل هو داخل في معدلي الحين؟
- id: 259
  c: C16
  ar: الحذف والإضافة على بوابة الطالب لمقررات التخصص الأساسي يفتح متى بالضبط؟ يعني كم يوم عندي قبل ما
    تبدأ الدراسة في الترم الأول 1448؟
- id: 260
  c: C16
  ar: أنا محتار صراحة — في الدليل الإرشادي مكتوب إن كافة إجراءات التسجيل تنتهي قبل بدء الدراسة بأسبوع،
    وصاحبي يقول إنه عدّل جدوله قبل الدراسة بيومين وما صار عليه شي. مين الصح للفصل الأول 1448؟
- id: 261
  c: C16
  ar: الترم متى يبدأ بالضبط؟ وأول محاضرة عندي في أي يوم ووين مكانها؟
- id: 262
  c: C16
  ar: في التقويم مكتوب "الانسحاب بعذر من المقرر" — هل هذا نفسه الانسحاب العادي من المادة؟ ومتى آخر موعد
    له في الفصل الأول 1448؟ وهل الفترة مفتوحة من بداية الترم؟
- id: 263
  c: C16
  ar: ظروفي صعبة هالترم وأفكر أعتذر عن الفصل كامل — لين متى أقدر أقدّم الطلب في الفصل الأول 1448؟
- id: 264
  c: C16
  ar: أبي أأجل الدراسة، متى آخر موعد للتقديم؟
- id: 265
  c: C16
  ar: متى الفاينل؟
- id: 266
  c: C16
  ar: أنا مسجّل مقرر حر هالترم — اختباره النهائي مع فترة المقررات العامة ولا مع التخصص؟
- id: 267
  c: C16
  ar: متى فترة الاختبارات النصفية لمقررات المتطلبات العامة في الترم الأول 1448؟ وفي أي أسبوع دراسي تقع؟
- id: 268
  c: C16
  ar: عندي سفر مع أهلي وأبي أرتب — وش الإجازات الرسمية في الفصل الأول 1448 ومتى نرجع دوام بعد كل إجازة؟
- id: 269
  c: C16
  ar: الدكتور يقول الدرجات بتنزل متأخرة — طيب آخر موعد لرصد الدرجات النهائية للفصل الأول 1448 متى؟
- id: 270
  c: C16
  ar: متى يفتح تسجيل الرغبات للفصل الثاني؟ وياليت تعطيني المواد اللي المفروض أحطها.
- id: 271
  c: C16
  ar: يا دكتور خلصت تقريباً كل متطلباتي وأتوقع أتخرج نهاية هالفصل — متى توزيع وثائق التخرج ومين الجهة
    اللي أراجعها؟
- id: 272
  c: C16
  ar: قبل ما نوزّع الشعب أبي أعداد الطلاب في كل برنامج مقسّمة على الشطرين، وبالذات IS شطر الطلاب لأن القسم
    رافع لنا طلب تدريس لهم.
- id: 273
  c: C16
  ar: الدكتورة تسأل عن MATH320 لطالبات CS — كم وحدة مؤهلة تسجّله الحين، ووش المتطلب اللي واقف في وجه الباقيات؟
- id: 274
  c: C16
  ar: نفكّر نفتح شعبة للتدريب التعاوني AI492 في برنامج AI2 الترم الجاي. كم طالب مؤهل له الحين؟
- id: 275
  c: C16
  ar: 'CS323: أعطني المؤهلين حسب البرنامج. وليش رقم AI يختلف عن CS وهو نفس المقرر بنفس الرمز؟'
- id: 276
  c: C16
  ar: وش أكثر المقررات طلباً في AI للترم القادم؟ ولا تعطيني شي ما نقدر نفتح له شعبة باسمه.
- id: 277
  c: C16
  ar: 'شطر الطالبات في CS: أبي أعلى ثلاثة مقررات طلباً للترم الجاي، ومتى بالضبط لازم ندخل الشعب في نظام
    القبول والتسجيل للفصل الثاني؟'
- id: 278
  c: C16
  ar: برنامج IS — كم وحدة عبؤها الموصى به تحت الحد الأدنى، ووش المقررات اللي نقدر نضيفها لهن عشان يرجعن
    فوق الخط؟
- id: 279
  c: C16
  ar: فيه طالبات في IS ما طلع لهن ولا مقرر مقترح للترم الجاي. أقول لرئيس القسم إنهن خلصن وتخرجن ولا وش
    أقول بالضبط؟
- id: 280
  c: C16
  ar: المرشد رقم 51 — كم طالب في محفظته، وكم واحد منهم ما عليه أي تسجيل هذا الترم؟ ورئيس القسم يبي التوزيع
    على البرامج.
- id: 281
  c: C16
  ar: عندنا لقاء إرشاد الأسبوع الجاي. المرشد 43 — مين من طلابه معدله تحت 2؟ وهل أقدر أعتبرهم على إنذار
    أكاديمي وأكلمهم على هالأساس؟
- id: 282
  c: C16
  ar: كم طالب في CS ناجح في CS211 و COE224 وما أخذ CS323 لين الحين؟ هذولا اللي بيزحمون شعب CS323.
- id: 283
  c: C16
  ar: عندي الطالبة 3456782 متوقعة تخرجها وأبي أسجّل لها بنفسي من حسابي. كم ساعة يسمح لها النظام تسجيلها
    هالفصل؟
- id: 284
  c: C16
  ar: الطلاب يسألوني عن إغلاق التعديلات. الدليل الإرشادي يقول تنتهي كافة إجراءات التسجيل قبل بدء الدراسة
    بأسبوع، والتقويم يعطيني تواريخ ثانية. أي وحدة أبلّغهم فيها؟
