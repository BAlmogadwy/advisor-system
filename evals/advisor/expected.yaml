meta:
  count: 284
  built: '2026-08-01'
  grading_contract:
    must_contain: Literal tokens. Matched case-insensitively as substrings after normalising Arabic-Indic
      digits to ASCII. Give the discriminating token (a number, a course code, an Arabic term), never
      a sentence.
    must_not_contain: PATTERNS, evaluated by a judge, not substrings. An entry describes a class of claim
      ('any specific number of absences'), so a literal string is a valid but narrow instance of one.
      This is the field that catches invention, and it is judged, not matched.
    must_abstain: True iff the question invites at least one specific claim that no obtained source and
      no registered capability can support. An answer that supplies such a claim fails regardless of anything
      else it got right.
  known_gaps:
  - No student fixture is bound yet, so FULL items whose must_contain asks for 'the student's actual course
    codes' cannot be graded on specifics. Binding a fixture student id plus the deterministic tool output
    is the next pass, and until it lands those items grade only on shape.
  - must_abstain was re-derived from one rule; the per-question judgement behind the original per-block
    values was not preserved and should be reviewed by a human against the questions.
expectations:
- id: 1
  answer_mode: FULL
  reason_code: NONE
  policy_ids:
  - TU.REG.ADVISER_DUTIES_AT_REGISTRATION
  - TU.ATTENDANCE.DEFERRING_EARLY_COURSES_TRAP
  - TU.LOAD.SEMESTER_RANGE
  - TU.REG.STUDENT_CHOICES_FINAL
  capabilities:
  - recommend_courses
  - my_progress
  - get_student_context
  must_contain:
  - أكواد مقررات فعلية من خطة الطالب مأخوذة من مخرجات الأداة
  - المتطلبات السابقة مستوفاة لهذه المقررات
  - '12'
  - '19'
  - سقف التوصية
  - اختياراتك لا تُعتمد إلا بمعرفة المرشد الأكاديمي
  must_not_contain:
  - 18 بوصفه الحد الأعلى المسموح بتسجيله
  - أوقات محاضرات أو أرقام شعب للفصل القادم
  - أي إشارة إلى درجة أو تقدير حصل عليه الطالب في مقرر
  - تأكيد أن التسجيل تم فعلاً
  must_abstain: false
  answer_sketch_ar: 'بحسب خطتك وما اجتزته، المقررات المتاحة لك الترم القادم هي: (قائمة الأكواد والأسماء
    والساعات) وكلها متطلباتها السابقة مستوفاة، ويُفضَّل تقديم مقررات المستويات الأولى المتبقية لأن الدليل
    يعد تأجيلها من الأخطاء المتكررة. هذه توصية آلية يتوقف اقتراحها عند 18 ساعة، بينما الحد النظامي للعبء
    في الفصل الرئيس 12–19 وحدة، ولا تُعتمد اختياراتك إلا بمعرفة مرشدك الأكاديمي.'
  notes: recommend_courses stops at credit_policy.RECOMMENDED_MAX_CREDITS=18, which is an advisory cap,
    not the ceiling; the ceiling is REGULATORY_MAX_CREDITS=19 (TU.LOAD.SEMESTER_RANGE). That record carries
    conflicts_with_implementation (recommender.py MAX_CREDITS=18) with resolution OWNER_DECISION_REQUIRED.
    No offering/section data exists for a future term, so the answer must not state when or whether a
    course will be taught.
