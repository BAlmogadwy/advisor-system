meta:
  name: planner-and-priority
  count: 50
  built: '2026-08-06'
  source: owner-supplied, 2026-08-06, written after reading the planner and recommender code paths rather
    than from the prompt.
  note: Exact tool equality is NOT the quality score. The first version required `build_my_timetable`
    for the rebuild hand-offs, a second `recommend_courses` call the timetable service already makes internally,
    and `why_course_locked` for two questions that name no course — so it scored the architecture against
    a system that does not exist. Six dimensions are scored separately instead.
  contract:
    required_tools: must be called. Empty when a deterministic route answers the question.
    allowed_tools: may be called without penalty; a correct answer may arrive differently.
    forbidden_tools: calling one is a routing error — e.g. the reverse-direction prerequisite tool for
      a forward-unlock question.
    expected_action: the structured route the payload must carry. null means no route.
    expected_facts: what the answer must ESTABLISH, independent of which tool produced it.
    must_not_claim: judged patterns, not substrings.
    clarification_allowed: true when the question names no course and one clarifying reply is a correct
      answer.
  scoring:
  - intent recognition
  - tool or action routing
  - factual grounding
  - policy compliance
  - safety
  - final-answer correctness
global_must_not_claim:
- a section's absence from the data means the university does not offer the course
- a proposed timetable proves a seat is available
- saving or preferring a planned alternative changes the official registration
- a recommendation proves a section exists for that course
