meta:
  name: advisor_v21_semantic_plan
  version: "2.8"
  built: "2026-09-02"
  count: 57
  languages:
    - ar-SA
    - en
  description: >-
    A focused holdout contract for semantic evidence planning. The utterances are
    deliberately phrased away from the legacy router's canonical wording and include
    counterexamples where academic-looking keywords must not trigger an unrelated tool.
  modes:
    - execute
    - clarify
    - direct
    - unsupported
  tool_surface:
    - my_progress
    - my_plan_by_term
    - my_timetable
    - my_clash_free_sections
    - build_timetable_proposal
    - lookup_course
    - course_prerequisites
    - why_course_locked
    - course_choice_comparison
    - feasible_course_replacements
    - recommend_courses
    - graduation_progress
    - policy_lookup
    - my_advisor
    - recommend_feasible_course_addition
    - rank_current_course_drop_impact
    - improve_current_timetable
  forbidden_model_arguments:
    - student_id
  scoring_dimensions:
    - mode_correct
    - clarification_kind_correct
    - outcomes_correct
    - outcome_coverage_correct
    - semantic_policy_correct
    - required_tools_correct
    - forbidden_tools_correct
    - tool_minimality_correct
    - arguments_correct
  quality_gate:
    candidate_min_exact_match_rate: 0.90
    candidate_min_unseen_paraphrase_rate: 0.90
    candidate_min_regex_false_positive_rate: 1.00
    candidate_min_required_tools_rate: 0.95
    candidate_min_forbidden_tools_rate: 1.00
    candidate_min_outcomes_rate: 1.00
    candidate_min_outcome_coverage_rate: 1.00
    candidate_min_semantic_policy_rate: 1.00
    candidate_min_clarification_kind_rate: 1.00
    minimum_absolute_lift_vs_v2: 0.10
    no_dimension_regressions: true
  contract_notes:
    - required_tools means every named capability must be selected.
    - Each required_any inner list is an OR group and at least one member must be selected.
    - allowed_tools is a strict allow-list; an unnecessary evidence call fails minimality.
    - required_arguments is a recursive partial match, so harmless optional arguments are allowed.
    - expected_outcomes is ordered and exact; extra incidental outcomes fail the case.
    - Every execute outcome must be owned by a selected capability, and every selected capability must be justified by an outcome.
    - unsupported is a typed no-tool decision; direct is reserved for general conversation.
    - forbidden_model_arguments applies recursively to every model-authored tool call.
    - Non-execute modes must emit no tool calls.

