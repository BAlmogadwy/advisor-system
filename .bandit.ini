# bandit's settings live in .bandit (YAML, passed to it with -c). This file only
# gives the pre-commit hook an --ini to name: without one, bandit walks every
# folder under "." for files called .bandit and stops ("Multiple .bandit files
# found") when it finds more than one - as it does whenever a Claude Code
# worktree, a full checkout with its own .bandit, sits under .claude/worktrees.
[bandit]
